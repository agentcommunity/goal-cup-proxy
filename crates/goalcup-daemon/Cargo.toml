[package]
name = "goalcup-daemon"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Dev-only feature: off by default and never enabled by a shipped build. It is turned on for
# this crate's integration tests through the self dev-dependency below, because they are
# separate crates and do not see `cfg(test)` here.
# `grep -rn 'feature = "test-hooks"' src/` is the list of what it gates.
#
# The shipped build compiles without the feature, and `cargo build --offline` (no features)
# is step zero of the gate in README.md precisely so that stays true: every other gate
# command builds dev-dependencies, which turn this feature on for the whole package.
[features]
test-hooks = []

[dependencies]
goalcup-protocol = { path = "../goalcup-protocol" }
goalcup-platform = { path = "../goalcup-platform" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
thiserror.workspace = true
# The entry registry (`src/registry.rs`). Its own database, separate from every run's
# evidence files, so a damaged run still leaves the daemon able to say what it was running.
redb.workspace = true
# `OsRng`, for the three per-run secrets `RunKeys::generate` mints.
rand.workspace = true
# `RunKeys` hands out an `ed25519_dalek::SigningKey` and the hex verifying key that
# `SignedStatus::verify_with` and `Chunk::verify` are pinned against.
ed25519-dalek.workspace = true
hex.workspace = true
# `workspace::sha256_hex` and the streaming digest the seal walk takes over a
# workspace file. The protocol crate hashes its own bytes; this crate hashes the
# participant's, and a crate cannot borrow another's private hasher.
sha2.workspace = true
# The stream redactor (`src/redact/stream.rs`).
base64.workspace = true

# The loopback control API (`src/control/`). `default-features = false` in the workspace:
# none of axum's optional extractors and, in particular, none of its `tracing` integration —
# the control listener handles the CLI's bearer and a crate that can log a request cannot
# promise it never logged one.
axum.workspace = true
# The runtime under that listener. No `fs`: filesystem I/O is `std::fs`.
# `io-util` and `sync` for the capture ingest listener (`src/ingest.rs`): length-framed
# reads from an authenticated local socket and bounded in-process queues.
tokio = { workspace = true, features = ["io-util", "sync"] }

# `--config`, `--foreground`, `--print-addresses` on the foreground binary
# (`src/bin/goalcup-daemon.rs`). A library dependency because a `[[bin]]` inside this
# package shares the package's dependency list; nothing in `src/*.rs` links it.
clap.workspace = true

# The shared redaction pattern set and the connector's `extra_patterns[]` (`src/redact.rs`).
# `regex::bytes`, because a record's bytes are what is redacted and a JSONL line the
# harness wrote is not guaranteed to be valid UTF-8.
regex.workspace = true

# The no-follow directory open and `fchmod` that make a configured root in
# `src/runtime/daemon.rs`, and the process calls under `src/terminate/`. Unix only, hence
# the target-gated dependency.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Tests only.
#   tempfile — every integration test that touches disk builds its tree in a tempdir:
#     nothing in the top-level `tests/*.rs` files writes outside one.
[dev-dependencies]
# This crate, back to itself, with `test-hooks` on: a `tests/*.rs` file links the library
# as an ordinary dependency, so this is the only way to hand the integration tests a
# feature the shipped build does not carry.
goalcup-daemon = { path = ".", features = ["test-hooks"] }
# The terminal-publication regressions read the exact offline interface participants' agents
# use, rather than treating a hand-parsed cache file as a substitute for goalcup-mcp.
goalcup-mcp = { path = "../goalcup-mcp" }
tempfile.workspace = true
