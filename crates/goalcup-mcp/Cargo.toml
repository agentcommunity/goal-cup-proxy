[package]
name = "goalcup-mcp"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# It links `goalcup-protocol` and nothing else in this tree.
#
# NOT `goalcup-cli`, although the entry record this server's pinned keys come from is that
# crate's file format: a shipped MCP binary that linked the CLI would carry the CLI's whole
# surface — the control-API client, the launcher, the grant reader — into a process an agent
# is invited to call. The two fields this crate needs are re-declared in `src/lib.rs` over
# the same JSON, and `tests/fixtures/entry-0007.json` is a record `goalcup-cli`'s own writer
# produced, so the two shapes cannot drift unobserved.
#
# NOT `goalcup-daemon` either. The interface to the daemon is two files in the status cache
# and there is deliberately no second one: this server opens no socket.
[dependencies]
goalcup-platform = { path = "../goalcup-platform" }
goalcup-protocol = { path = "../goalcup-protocol" }
serde.workspace = true
serde_json.workspace = true
# `--config-dir`, `--help`, `--version`, and a usage error that exits 1 rather than 2.
clap.workspace = true

# Tests only.
#   tempfile — every fixture in `tests/support/mod.rs` is a real `<config_dir>` on disk,
#     because what this crate does is read two files out of one.
#   ed25519-dalek — the tests play the DAEMON: they sign the status documents this server
#     verifies, and they sign one with a key it did not pin. Nothing this crate ships signs
#     anything; the verifying half comes through `goalcup-protocol`, which owns the
#     dependency, so the shipped binary declares none. Same arrangement, for the same
#     reason, as `goalcup-verifier`'s dev-dependency on it.
#   hex — a pinned run key is hex, and a test that pins one has to spell it.
[dev-dependencies]
tempfile.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true

[[bin]]
name = "goalcup-mcp"
path = "src/main.rs"
