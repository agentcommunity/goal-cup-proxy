# Expected `goalcup-verify --capture-integrity` verdicts for the committed v5 corpus.
# Read tests/v5_corpus.rs before editing: an expectation changes only in a pull request that
# carries a docs/DECISIONS.md row (D43 ruling 7). Adding a case is always allowed.
#
# Per case: `exit`, `integrity` and the exact `findings`, plus the report fields that say what
# the reader understood (`sealed`, `anchor`, `key_source`, `validated_records`, `validated_head`,
# `gap_count`, `coverage_incomplete`, `torn_tail`, `terminal_kind`, `verified_ack`). A case with
# `[case.record_counts]` also pins the `--research-json` count of every validated record kind.
# `dev_key = true` supplies the test signer's public key, as `--dev-key`.

[[case]]
