[[case]]
# The same trace without the server key: the receipt is unverifiable, so the trace is invalid.
# D54 amendment (21 Oct 2026): the signed cutoff and finalization bodies left the protocol, and a
# v5 line carrying a removed body is `record_malformed`. The scan therefore stops at seq 19, the
# cutoff, instead of reading through the finalization to the ack it can no longer reach
# (`ack_signature_unverified`). Same bytes, same exit 2; only the findings and prefix moved.
name = "signed-receipt-ack-unkeyed"
path = "signed-receipt-ack-finalization"
exit = 2
integrity = "invalid"
findings = ["receipt_key_not_accepted", "record_malformed"]
