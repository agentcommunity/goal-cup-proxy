[package]
name = "goalcup-verifier"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
goalcup-protocol = { path = "../goalcup-protocol" }
# `errno::clear` for the openat directory walker; the one shared thread-errno accessor.
goalcup-platform = { path = "../goalcup-platform" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
clap.workspace = true
thiserror.workspace = true
# M2 capture analysis (`src/capture_analysis/`): v5 `Segment` records carry sanitized bytes
# as base64, which the bounded reader and decoders decode.
base64.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Tests only.
#   tempfile — tests build capture traces in temporary directories.
#   ed25519-dalek — tests play the *server*: they sign receipts and acknowledgements so
#     `AckCheckpoint::verify` has something real to check. The library never signs; it only
#     verifies, through `goalcup-protocol`, which owns the dependency.
#   toml — the v5 corpus reads its expectations from `expected.toml`.
[dev-dependencies]
tempfile.workspace = true
toml.workspace = true
ed25519-dalek.workspace = true

[[bin]]
name = "goalcup-verify"
path = "src/bin/goalcup-verify.rs"
