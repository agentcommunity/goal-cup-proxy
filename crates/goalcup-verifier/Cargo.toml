[package]
name = "goalcup-verifier"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# `trust-fixture` compiles `PinTables::fixture` and `Pipeline::load_with_pin_tables`: the seam
# the frozen M2 legacy baseline (`tests/it/m2_legacy_baseline.rs`) uses to judge committed
# historical traces against fixture-owned pin tables. Only this crate's own dev-dependency
# below enables it, so no shipped build can be asked to trust a table it does not ship.
[features]
trust-fixture = []

[dependencies]
goalcup-protocol = { path = "../goalcup-protocol" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true
clap.workspace = true
thiserror.workspace = true
# M2 capture analysis (`src/capture_analysis/`): v5 `Segment` records carry sanitized bytes
# as base64, which the bounded reader and decoders decode.
base64.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Tests only.
#   tempfile — tests build unscrubbed chain exports in temporary directories, and the
#     adversarial fixture is regenerated into one before it is compared byte for byte
#     with the checked-in copy.
#   ed25519-dalek — tests play the *server*: they sign acknowledgements so
#     `AckCheckpoint::verify` has something real to check. The library never signs; it only
#     verifies, through `goalcup-protocol`, which owns the dependency.
[dev-dependencies]
goalcup-verifier = { path = ".", features = ["trust-fixture"] }
tempfile.workspace = true
ed25519-dalek.workspace = true

[[bin]]
name = "goalcup-verify"
path = "src/bin/goalcup-verify.rs"
