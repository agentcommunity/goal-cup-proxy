# Codex CLI 0.153.0, capture profile (T14; D38, D39). Recipe: docs/qualification/m2/launch-recipes.md §8.
schema_version = 1
id = "codex-cli"

[capture]
auth_hosts = ["auth.openai.com"]
continuation = "none: codex exec one turn, approval_policy=never, workspace-write without network, stdin /dev/null"
args = [
  "exec", "--json",
  "-m", "gpt-5.6-luna",
  "-c", 'model_reasoning_effort="low"',
  "-c", 'approval_policy="never"',
  "-c", "check_for_update_on_startup=false",
  "-c", 'projects={{ "{workspace}" = {{ trust_level = "trusted" }} }}',
  "-s", "workspace-write",
  "--skip-git-repo-check",
  "-C", "{workspace}",
  "--",
]

[capture.executable]
program = "codex"
version_args = ["--version"]

[capture.env]
SHELL = "/bin/zsh"

# D39 R10: one shared isolated CODEX_HOME; never seeded; runs serialized.
[capture.home]
run_home = "empty"
config_home = "shared"
env = "CODEX_HOME"
real_dirs = ["{user_home}/.codex"]

[capture.ca]
env = ["CODEX_CA_CERTIFICATE"]
mode = "extend"

[capture.identity]
source = "stdout_json"
binding = "at_launch"
match_field = "type"
match_value = "thread.started"
id_field = "thread_id"

[[capture.native]]
name = "rollout"
root = "{config_home}/sessions"
pattern = "*/*/*/rollout-*-{id}.jsonl"
form = "append_only"
protocol_hint = "codex-jsonl"

# D22: the npm wrapper hides the native binary.
[capture.termination]
strategy = "native_pid"
native_binary = "codex"
grace_seconds = 10

[redaction]
extra_patterns = [
  { kind = "codex_rate_limits", json_field = "rate_limits", value = "object" },
  { kind = "codex_plan_type", json_field = "plan_type", value = "string" },
  { kind = "codex_credits_remaining", json_field = "credits_remaining", value = "scalar" },
]

[[capture.hosts]]
host = "chatgpt.com"
evidence_paths = ["/backend-api/codex/responses"]
protocol_hint = "openai-responses"
