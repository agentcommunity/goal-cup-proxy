[package]
name = "goalcup-protocol"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
thiserror.workspace = true
goalcup-platform = { path = "../goalcup-platform" }

# `proc_pidinfo(PROC_PIDTBSDINFO)` supplies the microsecond process-creation
# timestamp used to reject PID reuse on the supported macOS target.
[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true

# Tests only.
#   tempfile — `tests/export_roundtrip.rs` writes a real trace directory: `TraceExport`
#     owns bytes on disk, so its tests have to read those bytes back rather than trust a
#     returned value.
[dev-dependencies]
tempfile.workspace = true
