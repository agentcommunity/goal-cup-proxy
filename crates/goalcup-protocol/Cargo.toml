[package]
name = "goalcup-protocol"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Test-only seams, never in a shipped build: `TraceExport::set_part_limits`. The daemon's own
# `test-hooks` turns this on; this crate's tests get it from the dev-dependency below.
[features]
test-hooks = []

[dependencies]
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
hex.workspace = true
ed25519-dalek.workspace = true
thiserror.workspace = true
goalcup-platform = { path = "../goalcup-platform" }

# `proc_pidinfo(PROC_PIDTBSDINFO)` supplies the microsecond process-creation
# timestamp used to reject PID reuse on the supported macOS target; `clock_gettime` reads
# the sleep-counting clock in `clock.rs`.
[target.'cfg(any(target_os = "macos", target_os = "linux"))'.dependencies]
libc.workspace = true

# Tests only.
#   tempfile — `tests/export_roundtrip.rs` writes a real trace directory: `TraceExport`
#     owns bytes on disk, so its tests have to read those bytes back rather than trust a
#     returned value.
#   goalcup-protocol — this crate, back to itself, with `test-hooks` on, so `tests/` can set
#     small chain part limits.
[dev-dependencies]
tempfile.workspace = true
goalcup-protocol = { path = ".", features = ["test-hooks"] }
