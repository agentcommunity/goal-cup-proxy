# NON-SHIPPING fixture connector: the headless, per-run-home shape. Engine tests load it so that
# no test of a launch rule depends on one shipped connector's values. It has a goal flag, a
# reserved env prefix, a private home made from its own seed files, a replace-mode CA variable
# of its own, a session id read from stderr at the finish, one
# snapshot session file and an argv guard. No build pins it, so it loads only through `--dev`.
schema_version = 1
id = "headless-per-run"

[capture]
args = ["chat", "-Q"]
goal_flag = "--query"
reserved_env_prefixes = ["PERRUN_"]
continuation = "none: one turn, session snapshot on, stdin /dev/null"

[capture.executable]
program = "per-run-harness"

[capture.env]
TOOL_HOME_MODE = "profile"

[capture.home]
run_home = "empty"
config_home = "per_run"
env = "PERRUN_HOME"
per_run_dir = "perrun"
dirs = ["home"]
real_dirs = ["{user_home}/.perrun"]
seed = [
  { file = "config.yaml" },
  { file = "auth.json" },
]

[capture.ca]
env = ["PERRUN_CA_BUNDLE"]
mode = "replace"

[capture.identity]
source = "stderr_line"
binding = "deferred"
prefix = "session_id: "
grammar = "timestamp-hex"

[[capture.native]]
name = "session"
root = "{config_home}/sessions"
pattern = "session_{id}.json"
form = "snapshot"

[capture.argv_guard]
long = ["profile", "tui", "help"]
short = ["p", "h"]
short_with_value = ["p", "m", "q"]
long_abbreviations = true

[capture.termination]
strategy = "process_group"
grace_seconds = 10

# A reserved name: nothing answers there, and a test start that runs this connector renames it
# to a loopback one, which is never probed.
[[capture.hosts]]
host = "api.per-run.example"
evidence_paths = ["/v1/chat/completions"]
protocol_hint = "openai-chat-completions"
