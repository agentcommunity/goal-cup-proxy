# NON-SHIPPING development connector: the controlled synthetic workload of the M2 local
# production vertical (tests/m2_synthetic_vertical.rs, spikes/m2-first-release/t23/run.sh).
# It is never a real Codex or Claude Code harness, and no build pins it, so `goalcup start`
# admits it only through `--dev`, which loads it as `Origin::Dev` (an interpreter and absolute
# paths in `args` are allowed there, and nothing else is relaxed).
#
# This file is a template. Its user writes a copy into a private connectors directory, read by
# both `goalcup` (GOALCUP_CONNECTORS_DIR) and `goalcup-daemon` (connectors_dir), with four
# placeholders filled from the machine it runs on:
#   @PYTHON3_SHA256@   sha256 of /usr/bin/python3, the pinned capture executable
#   @PYTHON3_VERSION@  its dotted version, as `python3 --version` prints it
#   @WORKLOAD@         absolute path of tests/fixtures/m2-controlled-workload.py
#   @CONFIG@           absolute path of the workload's JSON configuration
#
# The one native store sits under the run's own HOME (`{run_home}`), the only place the daemon
# reads a native store with no session identity from. Its protocol hint is unknown to every
# decoder, so the capture keeps the bytes and their semantics stay unavailable. The store's name
# is `workload`, so its stream labels stay `workload:native/<file>`.
schema_version = 1
id = "m2-controlled-workload"

[capture]
args = ["@WORKLOAD@", "@CONFIG@", "--"]
continuation = "none: one fixed traffic plan, no input after the goal"
auth_hosts = ["auth.e00.localhost"]

[capture.executable]
program = "python3"
version = "@PYTHON3_VERSION@"
sha256 = "@PYTHON3_SHA256@"

[capture.home]
run_home = "empty"
config_home = "shared"
env = "WORKLOAD_HOME"
real_dirs = ["{user_home}/.codex", "{user_home}/.claude", "{user_home}/.hermes"]

[capture.ca]
env = ["NODE_EXTRA_CA_CERTS"]
mode = "extend"

[capture.identity]
source = "none"

[[capture.native]]
name = "workload"
root = "{run_home}"
pattern = "native/*.jsonl"
form = "append_only"

[[capture.hosts]]
host = "api.e00.localhost"
evidence_paths = ["/v1/echo", "/v1/sse", "/v1/ws", "/v1/bulk"]
protocol_hint = "e00-controlled"
