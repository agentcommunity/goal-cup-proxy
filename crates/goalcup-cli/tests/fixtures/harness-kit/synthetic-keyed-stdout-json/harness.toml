schema_version = 1
id = "kit-synthetic-keyed-stdout-json"

[capture]
args = ["-I", "-S", "@STAND_IN@", "@PORT@", "@TEST_ID@", "@MARKER@", "--"]
continuation = "one keyed child, one stdout-bound offline echo and one snapshot"

[capture.executable]
program = "python3"
version = "@PYTHON3_VERSION@"
sha256 = "@PYTHON3_SHA256@"

[capture.home]
run_home = "empty"
config_home = "per_run"
env = "SYNTHCREDJSON_HOME"
per_run_dir = "credential-json-home"
dirs = ["snapshots"]
real_dirs = ["{user_home}/.codex", "{user_home}/.claude", "{user_home}/.hermes"]

[capture.credential]
env = "DEEPSEEK_API_KEY"

[capture.ca]
env = ["NODE_EXTRA_CA_CERTS"]
mode = "extend"

[capture.identity]
source = "stdout_json"
binding = "at_launch"
match_field = "subtype"
match_value = "init"
id_field = "session_id"

[[capture.native]]
name = "credential-json-case"
root = "{config_home}"
pattern = "snapshots/{id}.json"
form = "snapshot"

[[capture.hosts]]
host = "api.e00.localhost"
evidence_paths = ["/v1/echo"]
protocol_hint = "kit-credential-json-wire"
