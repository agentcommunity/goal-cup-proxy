schema_version = 1
id = "kit-synthetic-stderr-token"

[capture]
args = ["-I", "-S", "@STAND_IN@", "@PORT@", "@TEST_ID@", "@MARKER@", "--"]
continuation = "one deferred stderr-bound echo and one append-only file"

[capture.executable]
program = "python3"

[capture.home]
run_home = "empty"
config_home = "per_run"
env = "SYNTHSTDERR_HOME"
per_run_dir = "stderr-home"
real_dirs = ["{user_home}/.codex", "{user_home}/.claude", "{user_home}/.hermes"]

[capture.ca]
env = ["NODE_EXTRA_CA_CERTS"]
mode = "extend"

[capture.identity]
source = "stderr_line"
binding = "deferred"
prefix = "scope: "
grammar = "token"

[[capture.native]]
name = "stderr-case"
root = "{run_home}/sessions"
pattern = "session-{id}.jsonl"
form = "append_only"
protocol_hint = "kit-stderr-native"

[[capture.hosts]]
host = "api.e00.localhost"
evidence_paths = ["/v1/echo"]
protocol_hint = "kit-stderr-wire"
