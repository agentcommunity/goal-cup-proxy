schema_version = 1
id = "kit-synthetic-preassigned"

[capture]
args = ["-I", "-S", "@STAND_IN@", "@PORT@", "@TEST_ID@", "@MARKER@", "{session_id}", "--"]
continuation = "one preassigned offline echo and one identity-scoped append-only file"

[capture.executable]
program = "python3"

[capture.home]
run_home = "empty"
config_home = "per_run"
env = "SYNTHPREASSIGNED_HOME"
per_run_dir = "preassigned-home"
real_dirs = ["{user_home}/.codex", "{user_home}/.claude", "{user_home}/.hermes"]

[capture.ca]
env = ["NODE_EXTRA_CA_CERTS"]
mode = "extend"

[capture.identity]
source = "preassigned"
binding = "at_launch"

[[capture.native]]
name = "preassigned-case"
root = "{run_home}/sessions"
pattern = "session-{id}.jsonl"
form = "append_only"
protocol_hint = "kit-preassigned-native"

[[capture.hosts]]
host = "api.e00.localhost"
evidence_paths = ["/v1/echo"]
protocol_hint = "kit-preassigned-wire"
