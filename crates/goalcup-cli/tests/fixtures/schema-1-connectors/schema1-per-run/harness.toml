# FROZEN schema-1 contract fixture (docs/CONNECTOR-SCHEMA.md, "The connector contract").
# A harness nobody ships, written on 22 Oct 2026 with a home made fresh for each run: its own home
# variable pointed at a per-run config home with a folder name, directories and two seed files,
# a keychain_link run HOME, the shared OpenSSL CA row, and a host row with path prefixes and no
# hint. Its termination block sets only the grace. The connector contract tests load it and run
# it with a stand-in through `--dev`. Never edit this file to make a test pass: a core change that
# breaks it breaks every connector written against schema 1, and needs the deprecation rule.
schema_version = 1
id = "schema1-per-run"

[participant]
display_name = "Schema One Per Run"

[capture]
interactive = true
continuation = "chat: the participant types the prompt and may type keep going"
args = ["chat"]
resume_args = ["--resume"]

[capture.executable]
program = "schema-one-per-run"
version_args = ["version"]

[capture.home]
run_home = "keychain_link"
config_home = "per_run"
env = "SCHEMARUN_CONFIG_DIR"
per_run_dir = "schemarun-home"
dirs = ["sessions", "cache/tmp"]
real_dirs = ["{user_home}/.schemarun"]
seed = [
  { file = "settings.json" },
  { file = "themes/plain.toml", mode = "0400" },
]

[capture.ca]
env = ["SSL_CERT_FILE"]
mode = "extend"

[capture.identity]
source = "none"

[[capture.native]]
name = "session"
root = "{config_home}/sessions"
pattern = "*.jsonl"
form = "append_only"

[capture.termination]
grace_seconds = 5

[[capture.hosts]]
host = "api.schema-run.example"
evidence_paths = ["/v1/complete"]
prefix_paths = ["/v2/turns/"]
