# FROZEN schema-1 contract fixture (docs/CONNECTOR-SCHEMA.md, "The connector contract").
# A harness nobody ships, written on 22 Oct 2026 with the required fields only, so every default
# applies: no [participant], no resume_args, env, version_args or termination. It has no home
# variable, so it keeps its state and its login under one shared run HOME kept across runs, and
# its session log is a {run_home} root. The connector contract tests load it and run it with a
# stand-in through `--dev`. Never edit this file to make a test pass: a core change that breaks
# it breaks every connector written against schema 1, and needs the deprecation rule.
schema_version = 1
id = "schema1-minimal"

[capture]
interactive = true
continuation = "chat: the participant types the prompt and may type keep going"
args = []

[capture.executable]
program = "schema-one-minimal"

[capture.home]
run_home = "shared"
config_home = "per_run"
real_dirs = ["{user_home}/.schemamin"]

[capture.ca]
env = ["SCHEMAMIN_CA_CERT"]
mode = "extend"

[capture.identity]
source = "none"

[[capture.native]]
name = "log"
root = "{run_home}/.schemamin/logs"
pattern = "T-*.log"
form = "append_only"
since_run_start = true

[[capture.hosts]]
host = "api.schema-min.example"
evidence_paths = ["/v1/chat"]
