[package]
name = "goalcup-cli"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

# Off by default and never enabled by a shipped build. It exists for the same reason the
# daemon's `test-hooks` does: this crate's integration tests are separate crates and do not
# see `cfg(test)` in this one, so a fake this crate must be able to hand them has no other
# way to be reachable. Enabled for those tests through the self dev-dependency below and
# nowhere else.
#
# Every `feature = "test-support"` item is a fake or a seam that tests need and no
# participant runs: `MockDaemonClient` (`src/daemon/`) and the narrower seams marked with it
# (`grep -rn 'feature = "test-support"' src`).
#
# The shipped build compiles without the feature, and `cargo build --offline` (no features)
# is step zero of the gate precisely so that stays true: every other gate command builds
# dev-dependencies, which turn this feature ON for the whole package.
[features]
test-support = ["dep:ed25519-dalek"]

[dependencies]
goalcup-platform = { path = "../goalcup-platform" }
goalcup-protocol = { path = "../goalcup-protocol" }
# The key-fragment scan and `goalcup doctor` read capture traces through the verifier's
# reader and decoder registry. A library dependency and not a dev one.
goalcup-verifier = { path = "../goalcup-verifier" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# The seal's mirror walk (`src/seal.rs`) streams each file in 64 KiB chunks, the way the
# daemon's `workspace::measure` does, so two walks over one tree agree and a large file is
# never held whole. Already in this crate's graph through `goalcup-verifier`.
sha2.workspace = true
# The nine-command tree (`src/main.rs`).
clap.workspace = true
# The control API client. It is loopback cleartext, which is why the workspace declares ureq
# with `default-features = false`: no gzip decoder, and no TLS stack pulled in for a request to
# 127.0.0.1.
ureq.workspace = true
# `MockDaemonClient` and nothing else, which is why it is `optional` and why the only
# feature that turns it on is `test-support` above.
#
# The mock signs its `SignedStatus` with a fixed `[9u8; 32]` seed so a test can pin the run
# key it publishes; that is a SIGNING key, and nothing this CLI ships ever signs anything.
# The CLI's own half of the same protocol is `SignedStatus::verify_with`, which lives in
# `goalcup-protocol` and links this crate's verifying half through that crate — so the
# shipped binary still checks signatures and still declares no signature dependency of its
# own. Already a workspace dependency and already in the graph through `goalcup-protocol`,
# so this adds a new user of a crate that is compiled either way and never a new crate.
ed25519-dalek = { workspace = true, optional = true }
# The M2 recording proxy (`src/proxy/`). The shared seam
# (`proxy::api`) needs tokio's `AsyncRead`/`AsyncWrite` and the relay leaves need `io-util`
# and `sync`; `net`, `time`, `rt-multi-thread` and `macros` come from the workspace line.
# Still no `fs`: the proxy never touches a participant's disk through tokio.
tokio = { workspace = true, features = ["io-util", "sync"] }
# TLS termination toward the harness and upstream TLS toward the provider (ring provider
# only), the per-launch CA and leaf certificates, and the upstream validation roots.
rustls.workspace = true
tokio-rustls.workspace = true
rcgen.workspace = true
# Upstream TCP keepalive (`proxy::connect`): a blackholed provider path is noticed by the
# kernel instead of hanging a relay. Already in the graph through tokio, so no new crate.
socket2.workspace = true
webpki-roots.workspace = true
# `sha1`: the WebSocket accept-key derivation only (`proxy::http`). `flate2`: content
# decoding and permessage-deflate.
sha1.workspace = true
flate2.workspace = true
# Fresh random 128-bit producer and connection identifiers (`proxy::api::CaptureEmitter`).
# The workspace version the daemon already links, so no new crate.
rand.workspace = true
# The key-fragment scan decodes each trace stream's base64 segments (`src/key_scan.rs`). The
# workspace version the daemon and the verifier already link, so no new crate.
base64.workspace = true
# The upload chunks (`src/upload/uploader.rs`): each is one zstd frame, built in a spool file
# and streamed from it. `hex` spells their SHA-256 and the acknowledgement signatures.
zstd.workspace = true
hex.workspace = true

# `killpg` at the version probe's deadline (`preflight/probe.rs`): `process_group(0)` puts the
# harness in a group of its own, and a helper it backgrounded is only reachable by
# signalling that whole group — `Child::kill` alone reaches the direct child and leaves
# the helper running. Already a workspace dependency, already compiled for the daemon
# (`crates/goalcup-daemon/Cargo.toml`, which calls `killpg` the same way under
# `src/terminate/`), so this crate adds no new dependency to the graph, only a new user of
# one already in it. Unix only, same as the probe's own `process_group(0)`.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# Tests only.
#   tempfile — every test in this crate that touches disk builds its tree in a tempdir.
[dev-dependencies]
# This crate, back to itself, with `test-support` on: a `tests/*.rs` file links the library
# as an ordinary dependency, so this is the only way to hand the integration tests a
# feature the shipped build does not carry.
goalcup-cli = { path = ".", features = ["test-support"] }
# Tests only: `goalcup_protocol::pins::shipped_connector_ids`, the one list of shipped
# connectors every per-connector test loops over.
goalcup-protocol = { path = "../goalcup-protocol", features = ["test-hooks"] }
tempfile.workspace = true
# M2 proxy tests only: parse minted certificates.
x509-parser.workspace = true
# Tests only: the in-process daemon the capture rigs start (`tests/common/m2_cli_support`), the
# registry lock `tests/full/run_scoped_daemon.rs` holds, and the hook-gated items
# `m2_ipc_compose` drives (`IngestEntry::wait_outcome`), which is why `test-hooks` is named here:
# a narrow `-p goalcup-cli` test build needs it without the workspace's feature unification.
#
# The shipped binary links none of it: `cargo build --offline` builds no dev-dependency, and
# `tests/it/seal_scan.rs` (`the_shipped_binary_links_no_daemon`) asserts that `src/` names no
# daemon in code and that this line stays under `[dev-dependencies]`. There is no cycle:
# `goalcup-daemon` depends on neither this crate nor anything that does.
goalcup-daemon = { path = "../goalcup-daemon", features = ["test-hooks"] }
# Tests only: the local stand-in for the upload server (`tests/common/upload_server/`) is an axum
# app on loopback, the same crate and features the daemon's control endpoint already links.
axum.workspace = true

[[bin]]
name = "goalcup"
path = "src/main.rs"
