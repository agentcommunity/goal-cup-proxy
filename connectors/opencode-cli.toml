# OpenCode 1.19.5, checked against opencode.ai/docs (cli, config, permissions, network) and the 1.19.5 package.
# OpenCode 2 is opencode2-cli: same program and folders, told apart by the version prefix.
id = "opencode-cli"
name = "OpenCode"
program = "opencode"
version = "1."
resume = ["--continue"]
home = { XDG_CONFIG_HOME = "{home}/.config", XDG_DATA_HOME = "{home}/.local/share", XDG_STATE_HOME = "{home}/.local/state", XDG_CACHE_HOME = "{home}/.cache" }
env = { OPENCODE_DISABLE_AUTOUPDATE = "1" }
host_hints = [
  { file = "{home}/.config/opencode/*.json", key = "provider.*.options.baseURL" },
  { file = "{home}/.config/opencode/*.jsonc", key = "provider.*.options.baseURL" },
  { file = "{workspace}/opencode.json*", key = "provider.*.options.baseURL" },
  { file = "{workspace}/.opencode/opencode.json*", key = "provider.*.options.baseURL" },
]
secret_files = [
  "{home}/.local/share/opencode/auth.json", "{home}/.config/opencode/config.json",
  "{home}/.config/opencode/opencode.json", "{home}/.config/opencode/opencode.jsonc",
]
native = [{ name = "db", root = "{home}/.local/share/opencode", pattern = "opencode*.db*", form = "final" }]
no_prompts = [{ file = "{home}/.config/opencode/opencode.json", key = "permission", value = "allow" }]
