# Codex CLI 0.153.0, capture profile (D38, D39, D57). Facts: docs/harnesses/codex-cli.md.
schema_version = 1
id = "codex-cli"

[capture]
auth_hosts = ["auth.openai.com"]
# Chat mode (D57): Codex opens in the participant's terminal and the participant types the prompt.
# No model, effort, approval, sandbox or permission option (owner direction, 2026-10-14; D57):
# the harness's own defaults and the participant's own settings. The workspace is trusted, so no
# trust prompt stands between the participant and the prompt (measured 14 Oct 2026,
# docs/harnesses/codex-cli.md).
interactive = true
continuation = "chat: the participant types the prompt and may type keep going"
args = [
  "-c", "check_for_update_on_startup=false",
  "-c", 'projects={{ "{workspace}" = {{ trust_level = "trusted" }} }}',
  "-C", "{workspace}",
]
# `goalcup continue`: reopen the most recent session in the tracer's home. Not yet measured
# against a logged-in home (docs/harnesses/codex-cli.md, section 10).
resume_args = ["resume", "--last"]

[capture.executable]
program = "codex"
version_args = ["--version"]

[capture.env]
SHELL = "/bin/zsh"
# Node's built-in HTTP client honours HTTPS_PROXY (the run's loopback recorder) only with this (D59).
NODE_USE_ENV_PROXY = "1"

[capture.platform.linux-x86_64.env]
SHELL = "/bin/bash"

[capture.platform.linux-aarch64.env]
SHELL = "/bin/bash"

# D39 R10: one shared isolated CODEX_HOME; never seeded; runs serialized.
[capture.home]
run_home = "empty"
config_home = "shared"
env = "CODEX_HOME"
real_dirs = ["{user_home}/.codex"]
# The goal-cup skill is put in the harness home's `skills/goal-cup/` before each launch.
skills_dir = "skills"

[capture.ca]
env = ["CODEX_CA_CERTIFICATE"]
mode = "extend"

# D57: no session id is known at launch. The run's sessions are every rollout new or written
# since the run started, which is safe because runs on the shared home are serialized (D39).
[capture.identity]
source = "none"

[[capture.native]]
name = "rollout"
root = "{config_home}/sessions"
pattern = "*/*/*/rollout-*.jsonl"
form = "append_only"
protocol_hint = "codex-jsonl"
since_run_start = true

# D22: the npm wrapper hides the native binary.
[capture.termination]
strategy = "native_pid"
native_binary = "codex"
grace_seconds = 10

# Codex writes its plan, quota and credit balance into events and responses; strip them at
# capture (D26, D39). Each row names a JSON field and its value form, never a regex.
[redaction]
extra_patterns = [
  { kind = "codex_rate_limits", json_field = "rate_limits", value = "object" },
  { kind = "codex_plan_type", json_field = "plan_type", value = "string" },
  { kind = "codex_credits_remaining", json_field = "credits_remaining", value = "scalar" },
]

[[capture.hosts]]
host = "chatgpt.com"
evidence_paths = ["/backend-api/codex/responses"]
protocol_hint = "openai-responses"
