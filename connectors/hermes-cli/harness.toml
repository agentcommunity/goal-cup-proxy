# Hermes Agent, capture profile (D57, D61, D72). Facts: docs/harnesses/hermes-cli.md.
# The capture recipe was measured on 0.19.0; launch prep was measured on 0.22.5, 0.19.0 untested.
schema_version = 1
id = "hermes-cli"

[participant]
display_name = "Hermes"
# Shown just before Hermes opens. A home that `goalcup prep` set up asks nothing; one that was
# not set up asks first, and Hermes closes when its setup ends (measured 16 Oct 2026). That run
# has no session file yet, so `goalcup continue` opens `hermes chat` the normal way, without
# `--continue` (which would find no session and exit 1), and the setup is kept in the home. A
# field may not name the tracker (F7), so the hint says "continue the run".
first_screen = "If Hermes asks to run setup, do it now, before you type your prompt: answer Y and pick your provider and model. Hermes then closes; continue the run, then type your prompt."
# Hermes's section of docs/HARNESS-SETUP.md, which `goalcup prep` links to (fix plan v8).
setup_section = "hermes"

# Fix plan v9: where the participant adds `goalcup mcp`, the time-left tool; prep prints the lines
# and never writes them. Hermes hands an MCP server only PATH, HOME and a few more, plus its
# `env` map, whose `${VAR}` it fills from its own environment (read from the 0.19.0 source,
# `tools/mcp_tool.py`; not measured).
[participant.time_left_tool]
file = "config.yaml"
key = "mcp_servers"
pass_env = "env_template"

# D67: what `goalcup prep` recommends, and never sets: no approval prompt for commands Hermes
# deems dangerous (an unquoted YAML `off` reads as false, which Hermes also takes as off).
# docs/harnesses/hermes-cli.md, "Run without permission prompts".
[[participant.no_prompts]]
file = "config.yaml"
key = "approvals.mode"
values = ["off", "false"]

[capture]
# Chat mode (D57): `hermes chat` opens Hermes's classic REPL in the participant's terminal and the
# participant types the prompt; `/exit`, `/quit` or Ctrl-D end it with exit 0 (measured 16 Oct
# 2026). No provider, model or key option (D61): Hermes uses whatever the participant set up in
# its home, and goalcup never sees, passes or stores a provider key.
interactive = true
continuation = "chat: the participant types the prompt and may type keep going"
args = ["chat"]
# `goalcup continue`: reopen the most recent session in goalcup's home (measured 16 Oct 2026:
# `hermes chat --continue` resumes it, `Resumed session <id>`).
resume_args = ["--continue"]
# How Hermes stores its session, and nothing about how the agent behaves (D61). Run in the shared
# home after the participant's setup and before each launch; each writes one key into
# `config.yaml`, and neither has an environment variable.
# - `sessions.write_json_snapshots` (default off): without it there is no session file to read.
# - `compression.in_place` (default on): an in-place compaction keeps the session id with fewer
#   messages, and Hermes then never rewrites a snapshot that holds more (`run_agent.py:2754`), so
#   the file stops changing. Off, a compaction starts a new id and so a new
#   `session_<id>.json` (`agent/conversation_compression.py:1247`, `run_agent.py:2723`), which the
#   native source reads. Compression itself stays as the participant has it.
configure = [
  ["config", "set", "sessions.write_json_snapshots", "true"],
  ["config", "set", "compression.in_place", "false"],
]
# Hermes's own switches (HERMES_SAFE_MODE, HERMES_IGNORE_USER_CONFIG) would silently stop the
# session snapshot; `capture.env` may set none of them.
reserved_env_prefixes = ["HERMES_"]
# The model service is the participant's choice (D62). Hermes's own setup, and `/model`, save
# its address as `model.base_url` in `config.yaml` (`hermes_cli/model_setup_flows.py:2890-2905`,
# `hermes_cli/auth.py:6639-6700`, Hermes 0.19.0). A `<PROVIDER>_BASE_URL` in `.env` overrides it
# at run time and is not read (a known gap, docs/harnesses/hermes-cli.md section 9). goalcup reads that one key at each start
# and continue and records that host only; every other host stays an opaque tunnel. There is
# no provider list: `HERMES_CA_BUNDLE` (below) trusts the recording proxy alone, so a listed host
# the participant does not use would only be probed, and an unlisted one they do use would fail.
model_host_from = { file = "config.yaml", key = "model.base_url" }

[capture.executable]
program = "hermes"
# `hermes --version` prints `Hermes Agent v0.19.0 (2026.7.20)` in under a second with a fresh
# HOME (measured 22 Oct 2026; it writes only `.hermes/.update_check` and logs there, which the
# probe home discards).
version_args = ["--version"]

[capture.env]
TERMINAL_HOME_MODE = "profile"

# D39 R10, D61: one shared isolated HERMES_HOME; never seeded; runs serialized. The participant's
# own setup (`goalcup prep` opens Hermes there) keeps the provider, model and key in it.
[capture.home]
run_home = "empty"
config_home = "shared"
env = "HERMES_HOME"
real_dirs = ["{user_home}/.hermes"]

# HERMES_CA_BUNDLE replaces the roots of Hermes's provider clients with the proxy CA alone, which
# fails closed (D41).
[capture.ca]
env = ["HERMES_CA_BUNDLE"]
mode = "replace"

# D57: no session id is known at launch (the banner prints one on the terminal, which goalcup
# does not read). The run's sessions are every snapshot new or written since the run started,
# which is safe because runs on the shared home are serialized (D39).
[capture.identity]
source = "none"

# Only session snapshots; never a request_dump_* file (D41). No native decoder yet. Hermes
# 0.21.1 and later write no session file (D72): their model calls are recorded and nothing
# else, so a missing file is not a problem worth a status line.
[[capture.native]]
name = "session"
root = "{config_home}/sessions"
pattern = "session_*.json"
form = "snapshot"
since_run_start = true
warn_missing = false

# Hermes scans raw argv for -p/--profile, --tui, --cli and -h before argparse, which abbreviates.
[capture.argv_guard]
long = ["profile", "tui", "cli", "help"]
short = ["p", "h"]
short_with_value = ["p", "z", "m", "t", "r", "s", "q", "c"]
long_abbreviations = true

[capture.termination]
strategy = "process_group"
grace_seconds = 10

# D72: Hermes 0.22 sends every model call through a gateway process of its own, one per
# HERMES_HOME, which keeps the environment of whoever started it and ignores HERMES_CA_BUNDLE;
# on macOS only a provider entry's `ssl_ca_cert` makes it trust the recording proxy. So before
# each launch the run's CA is written to `recorder-ca.pem` in the home, a provider entry for
# the model service's URL names it, and a gateway left running from before is stopped, last,
# so `hermes chat` starts a fresh one with the run's proxy. The entry and the file are named
# `recorder` because a connector may not name the tracker (F7). Hermes 0.19.0 has no `-y` on
# `gateway stop` and exits 2; a failed command is only logged. docs/harnesses/hermes-cli.md,
# "Hermes 0.22: the gateway and certificate trust".
[launch_prep]
ca_file = "recorder-ca.pem"
commands = [
  ["config", "set", "providers.recorder.base_url", "{model_base_url}"],
  ["config", "set", "providers.recorder.ssl_ca_cert", "{ca_file}"],
  ["gateway", "stop", "-y"],
]
