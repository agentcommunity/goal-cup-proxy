# Crush 0.99.0, checked against github.com/charmbracelet/crush (README at v0.99.0: configuration, environment,
# Hyper, permissions) and the 0.99.0 release binary and source. The JSON config files are hinted; a crushrc is
# Bash, so a provider added there is not. Prompts: README "Permissions" says `--yolo` skips every permission
# prompt (root.go: `--yolo`, `-y`, "Automatically accept all permissions"); the config key
# `permissions.allowed_tools` is a list and a `no_prompts` value is one string, so the flag is used. Crush's
# first-run AGENTS.md init prompt (internal/config/init.go) is shown while `<data_directory>/init` is absent and
# no context file is in the folder; no key, flag or variable turns it off, so nothing is set for it. The session database sits in the workspace (data_directory, --data-dir).
id = "crush-cli"
name = "Crush"
program = "crush"
args = ["--yolo"]
resume = ["--continue"]
home = { XDG_CONFIG_HOME = "{home}/.config", XDG_DATA_HOME = "{home}/.local/share", XDG_STATE_HOME = "{home}/.local/state", XDG_CACHE_HOME = "{home}/.cache" }
unset = ["CRUSH_CLIENT_SERVER", "CRUSH_GLOBAL_CONFIG", "CRUSH_GLOBAL_DATA"]
host_hints = [
  { file = "{home}/.config/crush/crush.json", key = "providers.*.base_url" },
  { file = "{home}/.local/share/crush/crush.json", key = "providers.*.base_url" },
  { file = "{workspace}/crush.json", key = "providers.*.base_url" },
  { file = "{workspace}/.crush.json", key = "providers.*.base_url" },
  { file = "{workspace}/.crush/crush.json", key = "providers.*.base_url" },
]
hint_env = ["HYPER_URL"]
secret_files = [
  "{home}/.local/share/crush/crush.json", "{home}/.config/crush/crush.json", "{workspace}/.crush/crush.json",
  "{workspace}/crush.json", "{workspace}/.crush.json",
]
native = [{ name = "db", root = "{workspace}/.crush", pattern = "crush.db*", form = "final" }]
first_screen = "Crush may offer to create an AGENTS.md for this folder first. Answer or dismiss that screen, then type your prompt. goalcup starts Crush with --yolo, so tool calls run without asking."
