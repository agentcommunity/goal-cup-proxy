# Crush 0.99.0; facts, sources and the permission-prompt note: docs/harnesses/crush-cli.md.
id = "crush-cli"
name = "Crush"
program = "crush"
resume = ["--continue"]
home = { XDG_CONFIG_HOME = "{home}/.config", XDG_DATA_HOME = "{home}/.local/share", XDG_STATE_HOME = "{home}/.local/state", XDG_CACHE_HOME = "{home}/.cache" }
unset = ["CRUSH_CLIENT_SERVER", "CRUSH_GLOBAL_CONFIG", "CRUSH_GLOBAL_DATA"]
host_hints = [
  { file = "{home}/.config/crush/crush.json", key = "providers.*.base_url" },
  { file = "{home}/.local/share/crush/crush.json", key = "providers.*.base_url" },
  { file = "{workspace}/crush.json", key = "providers.*.base_url" },
  { file = "{workspace}/.crush.json", key = "providers.*.base_url" },
  { file = "{workspace}/.crush/crush.json", key = "providers.*.base_url" },
]
hint_env = ["HYPER_URL"]
secret_files = [
  "{home}/.local/share/crush/crush.json", "{home}/.config/crush/crush.json", "{workspace}/.crush/crush.json",
  "{workspace}/crush.json", "{workspace}/.crush.json",
]
native = [{ name = "db", root = "{workspace}/.crush", pattern = "crush.db*", form = "final" }]
first_screen = "Crush may offer to create an AGENTS.md for this folder first. Answer or dismiss that screen, then type your prompt. Crush asks before it runs a tool, and goalcup does not switch that off for Crush; pick Allow for session at the first prompt if you want it to run on."

[usage]
# Crush 0.99.0 (internal/db/migrations, session.HashID): sessions(id, parent_session_id); its
# X-Session-Id header is the xxh3-64 of the id.
thread = ["x-session-id"]
join = "thread"
thread_db = { row = "db", file = "crush.db*", table = "sessions", id = "id", parent = "parent_session_id", xxh3 = true }
