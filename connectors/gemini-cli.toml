# Gemini CLI, checked against geminicli.com docs (reference/configuration, cli/session-management) and
# the package. GEMINI_CLI_HOME stands in for the home folder, so its files sit under {home}/.gemini.
id = "gemini-cli"
name = "Gemini CLI"
program = "gemini"
checked = "0.66.0"
resume = ["--resume", "latest"]
home = { GEMINI_CLI_HOME = "{home}" }
host_hints = [
  { file = "{home}/.gemini/.env", key = "GOOGLE_GEMINI_BASE_URL" },
  { file = "{home}/.gemini/.env", key = "CODE_ASSIST_ENDPOINT" },
  { file = "{workspace}/.gemini/.env", key = "GOOGLE_GEMINI_BASE_URL" },
  { file = "{workspace}/.gemini/.env", key = "CODE_ASSIST_ENDPOINT" },
  { file = "{workspace}/.env", key = "GOOGLE_GEMINI_BASE_URL" },
  { file = "{workspace}/.env", key = "CODE_ASSIST_ENDPOINT" },
]
hint_env = ["GOOGLE_GEMINI_BASE_URL", "CODE_ASSIST_ENDPOINT"]
secret_files = ["{home}/.gemini/.env", "{home}/.gemini/oauth_creds.json"]
native = [{ name = "chats", root = "{home}/.gemini/tmp", pattern = "**/chats/**/*.jsonl" }]
# The ide rows keep Gemini off the participant's editor: its nudge never shows, and a yes to it is undone at every start.
update_off = [
  { file = "{home}/.gemini/settings.json", key = "general.enableAutoUpdate", value = "false" },
  { file = "{home}/.gemini/settings.json", key = "ide.enabled", value = "false" },
  { file = "{home}/.gemini/settings.json", key = "ide.hasSeenNudge", value = "true" },
]
# Approvals: only the launch flag switches them off (docs/harnesses/gemini-cli.md); start and continue add it after setup's yes.
no_prompts_args = ["--approval-mode", "yolo"]
# An untrusted folder turns yolo back off, and the docs disagree on whether folder trust is on by default.
first_screen = "Gemini CLI may ask whether you trust this folder. Trust it so Gemini can use automatic approval."

[usage]
readers = [{ row = "chats", file = "*.jsonl", reader = "gemini-chat" }]
# A chat call's `tokens` equal the reply's `usageMetadata`; a utility call no chat holds stays wire only.
join = "time"
