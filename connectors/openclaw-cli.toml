# OpenClaw 2026.10.9 (Node 24.22.1+), checked against docs.openclaw.ai (help/environment, cli, cli/tui,
# cli/gateway/service, cli/approvals, security/network-proxy) and the 2026.10.9 package. The path and profile
# variables are unset so state stays under {home}; a workspace .env drops every OPENCLAW_* key, and the
# global .env or gateway.env setting them again is refused. Known limit: the agent works in its own
# workspace under OPENCLAW_HOME, not the project. OPENCLAW_WORKSPACE_DIR ("Override the default agent workspace",
# docs.openclaw.ai/help/environment) would fix it, but `chat` has no workspace flag (2026.10.9 package) and the loader fills
# {workspace} only in args and in `home` values that start with {home}, so this file cannot name it yet.
id = "openclaw-cli"
name = "OpenClaw"
program = "openclaw"
args = ["chat"]
home = { OPENCLAW_HOME = "{home}" }
env = { OPENCLAW_NO_AUTO_UPDATE = "1" }
unset = ["OPENCLAW_PROXY_URL", "OPENCLAW_STATE_DIR", "OPENCLAW_CONFIG_PATH", "OPENCLAW_PROFILE"]
refuse_if_set = [
  { file = "{home}/.openclaw/openclaw.json", keys = ["proxy.proxyUrl", "env.OPENCLAW_PROXY_URL", "env.vars.OPENCLAW_PROXY_URL"] },
  { file = "{home}/.openclaw/.env", keys = [
    "OPENCLAW_PROXY_URL", "OPENCLAW_STATE_DIR", "OPENCLAW_CONFIG_PATH", "OPENCLAW_PROFILE",
  ] },
  { file = "{home}/.config/openclaw/gateway.env", keys = [
    "OPENCLAW_PROXY_URL", "OPENCLAW_STATE_DIR", "OPENCLAW_CONFIG_PATH", "OPENCLAW_PROFILE",
  ] },
]
secret_files = ["{home}/.openclaw/.env", "{home}/.openclaw/openclaw.json"]
native = [
  { name = "agents", root = "{home}/.openclaw/agents", pattern = "*/agent/openclaw-agent.sqlite*", form = "final" },
  { name = "state", root = "{home}/.openclaw/state", pattern = "openclaw.sqlite*", form = "final" },
]
