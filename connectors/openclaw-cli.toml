# OpenClaw; facts: docs/harnesses/openclaw-cli.md.
# No database rows: both SQLite files hold OpenClaw's auth profiles, which masking cannot see (facts sheet, section 5).
id = "openclaw-cli"
name = "OpenClaw"
program = "openclaw"
checked = "2026.10.9"
args = ["chat"]
home = { OPENCLAW_HOME = "{home}" }
env = { OPENCLAW_NO_AUTO_UPDATE = "1", OPENCLAW_WORKSPACE_DIR = "{workspace}" }
unset = ["OPENCLAW_PROXY_URL", "OPENCLAW_STATE_DIR", "OPENCLAW_CONFIG_PATH", "OPENCLAW_PROFILE"]
refuse_if_set = [
  { file = "{home}/.openclaw/openclaw.json", keys = ["proxy.proxyUrl", "env.OPENCLAW_PROXY_URL", "env.vars.OPENCLAW_PROXY_URL"] },
  { file = "{home}/.openclaw/.env", keys = [
    "OPENCLAW_PROXY_URL", "OPENCLAW_STATE_DIR", "OPENCLAW_CONFIG_PATH", "OPENCLAW_PROFILE",
  ] },
  { file = "{home}/.config/openclaw/gateway.env", keys = [
    "OPENCLAW_PROXY_URL", "OPENCLAW_STATE_DIR", "OPENCLAW_CONFIG_PATH", "OPENCLAW_PROFILE",
  ] },
]
host_hints = [{ file = "{home}/.openclaw/openclaw.json", key = "models.providers.*.baseUrl" }]
secret_files = [
  "{home}/.openclaw/.env", "{home}/.openclaw/openclaw.json",
  "{home}/.openclaw/agents/main/agent/openclaw-agent.sqlite", "{home}/.openclaw/state/openclaw.sqlite",
]
first_screen = "Before your prompt: if an OpenClaw Gateway runs on this computer (openclaw gateway status), stop it with openclaw gateway stop; one started outside the run calls models unrecorded. On a new run, type /new first so OpenClaw does not carry on an earlier run's conversation; after goalcup continue, do not."
