# OpenClaw; facts and the known workspace limit: docs/harnesses/openclaw-cli.md.
id = "openclaw-cli"
name = "OpenClaw"
program = "openclaw"
checked = "2026.10.9"
args = ["chat"]
home = { OPENCLAW_HOME = "{home}" }
env = { OPENCLAW_NO_AUTO_UPDATE = "1" }
unset = ["OPENCLAW_PROXY_URL", "OPENCLAW_STATE_DIR", "OPENCLAW_CONFIG_PATH", "OPENCLAW_PROFILE"]
refuse_if_set = [
  { file = "{home}/.openclaw/openclaw.json", keys = ["proxy.proxyUrl", "env.OPENCLAW_PROXY_URL", "env.vars.OPENCLAW_PROXY_URL"] },
  { file = "{home}/.openclaw/.env", keys = [
    "OPENCLAW_PROXY_URL", "OPENCLAW_STATE_DIR", "OPENCLAW_CONFIG_PATH", "OPENCLAW_PROFILE",
  ] },
  { file = "{home}/.config/openclaw/gateway.env", keys = [
    "OPENCLAW_PROXY_URL", "OPENCLAW_STATE_DIR", "OPENCLAW_CONFIG_PATH", "OPENCLAW_PROFILE",
  ] },
]
secret_files = ["{home}/.openclaw/.env", "{home}/.openclaw/openclaw.json"]
native = [
  { name = "agents", root = "{home}/.openclaw/agents", pattern = "*/agent/openclaw-agent.sqlite*", form = "final" },
  { name = "state", root = "{home}/.openclaw/state", pattern = "openclaw.sqlite*", form = "final" },
]
