# Claude Code 2.1.283, capture profile (D38, D39, D57). Facts: docs/harnesses/claude-code-cli.md.
schema_version = 1
id = "claude-code-cli"

[participant]
display_name = "Claude Code"
# Shown just before the harness opens: a fresh run folder makes it ask this once.
first_screen = "Claude Code may ask whether you trust this folder. Choose Yes."
# Claude Code's section of docs/HARNESS-SETUP.md, which `goalcup prep` links to (fix plan v8).
setup_section = "claude-code"

# Fix plan v9: where the participant adds `goalcup mcp`, the time-left tool; prep prints the lines
# and never writes them. `claude mcp add --scope user` writes `mcpServers` in `.claude.json` of
# CLAUDE_CONFIG_DIR, and the server gets Claude Code's environment (measured, 2.1.299).
[participant.time_left_tool]
file = ".claude.json"
key = "mcpServers"
pass_env = "inherited"

# D67: what `goalcup prep` recommends, and never sets: bypass mode, and the one-time acceptance
# of its disclaimer, without which Claude Code falls back to asking (2.1.283, 2.1.299).
# docs/harnesses/claude-code-cli.md, "Run without permission prompts".
[[participant.no_prompts]]
file = "settings.json"
key = "permissions.defaultMode"
values = ["bypassPermissions"]

[[participant.no_prompts]]
file = "settings.json"
key = "skipDangerousModePermissionPrompt"
values = ["true"]

[capture]
auth_hosts = ["platform.claude.com"]
# The default model host, from the shared provider table (crates/goalcup-protocol/providers.toml).
providers = ["anthropic"]
# Or the gateway the participant's own `settings.json` names (D74): `env.ANTHROPIC_BASE_URL` in
# CLAUDE_CONFIG_DIR, the Goal Cup home Claude Code reads its user settings from. When it is not
# set (a subscription or API-key login), the run records the default host above.
model_host_from = { file = "settings.json", key = "env.ANTHROPIC_BASE_URL", absent = "defaults" }
# Chat mode (D57): Claude Code opens in the participant's terminal and the participant types the
# prompt. No model, effort, permission or MCP option (owner direction, 2026-10-14; D57): the
# harness's own defaults and the participant's own settings. A fresh workspace asks once whether
# the participant trusts the folder (measured 14 Oct 2026, docs/harnesses/claude-code-cli.md).
interactive = true
continuation = "chat: the participant types the prompt and may type keep going"
args = []
# `goalcup continue`: reopen the workspace's most recent session; measured to append to the
# same session file (docs/harnesses/claude-code-cli.md, section 10).
resume_args = ["--continue"]

[capture.executable]
program = "claude"
version_args = ["--version"]

[capture.env]
SHELL = "/bin/zsh"
# Node's built-in HTTP client honours HTTPS_PROXY (the run's loopback recorder) only with this (D59).
NODE_USE_ENV_PROXY = "1"
DISABLE_AUTOUPDATER = "1"
# Documented for unattended sessions (Claude Code 2.1.186+, raised defaults 2.1.199+): a dropped
# connection, timeout or server error is retried up to 300 times (about three hours of backoff)
# instead of 10, and 429/529 capacity errors indefinitely, so a network outage of minutes does
# not end the run. A spend-limit or exhausted-credit 429 still fails at once.
CLAUDE_CODE_RETRY_WATCHDOG = "1"

[capture.platform.linux-x86_64.env]
SHELL = "/bin/bash"

[capture.platform.linux-aarch64.env]
SHELL = "/bin/bash"

# D38: HOME holds only Library/Keychains; CLAUDE_CONFIG_DIR is the shared isolated dir.
[capture.home]
run_home = "keychain_link"
config_home = "shared"
env = "CLAUDE_CONFIG_DIR"
real_dirs = ["{user_home}/.claude"]
# The goal-cup skill is put in the harness home's `skills/goal-cup/` before each launch.
skills_dir = "skills"

[capture.ca]
env = ["NODE_EXTRA_CA_CERTS"]
mode = "extend"

# D57: no session id is passed at launch. The run's sessions are every transcript new or written
# since the run started (a `claude --continue` appends to an old one), which is safe because
# runs on the shared home are serialized (D39).
[capture.identity]
source = "none"

[[capture.native]]
name = "main"
root = "{config_home}/projects"
pattern = "*/*.jsonl"
form = "append_only"
protocol_hint = "claude-code-jsonl"
since_run_start = true

# Subagents (D57). Each subagent writes its own transcript and a meta file beside the session it
# serves: `<session-id>/subagents/agent-<id>.jsonl`. That direct shape is observed in one real run
# (kit run `task-5-subagents`, 29 Oct 2026, linux-x86_64, Claude Code 2.1.310, where the transcript
# was in the capture chain). The wider pattern is community write-ups only, not vendor docs or a
# re-fetched source. A subagent started by a workflow script writes one level deeper, under
# `subagents/workflows/<workflow-id>/`, which was observed on disk, so it has its own rows.
# Large tool output spills to `<session-id>/tool-results/`. Every row reads from the run's start,
# as the main row does (D57). Older binaries refuse this connector: schema 1 grew (D68 is proposed).
[[capture.native]]
name = "subagents"
root = "{config_home}/projects"
pattern = "*/*/subagents/agent-*.jsonl"
form = "append_only"
protocol_hint = "claude-code-jsonl"
since_run_start = true
warn_missing = false

[[capture.native]]
name = "subagent-meta"
root = "{config_home}/projects"
pattern = "*/*/subagents/agent-*.meta.json"
form = "snapshot"
since_run_start = true
warn_missing = false

[[capture.native]]
name = "workflow-subagents"
root = "{config_home}/projects"
pattern = "*/*/subagents/workflows/*/agent-*.jsonl"
form = "append_only"
protocol_hint = "claude-code-jsonl"
since_run_start = true
warn_missing = false

[[capture.native]]
name = "workflow-subagent-meta"
root = "{config_home}/projects"
pattern = "*/*/subagents/workflows/*/agent-*.meta.json"
form = "snapshot"
since_run_start = true
warn_missing = false

[[capture.native]]
name = "tool-results"
root = "{config_home}/projects"
pattern = "*/*/tool-results/*"
form = "snapshot"
since_run_start = true
warn_missing = false

[capture.termination]
strategy = "process_group"
grace_seconds = 10

# Claude Code sends a billing header, also inside the system prompt; strip it at capture
# (D26, D39). The row names the header prefix, never a regex.
[redaction]
extra_patterns = [
  { kind = "anthropic_billing_header", header_prefix = "x-anthropic-billing-" },
]
