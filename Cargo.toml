[workspace]
resolver = "3"
members = ["crates/goalcup", "crates/goalcup-format", "crates/goalcup-verify"]

[workspace.package]
edition = "2024"
# The only place a version is written. Every crate inherits it (`version.workspace = true`), and
# the binaries and report fields read it through `env!("CARGO_PKG_VERSION")`. Change it with
# `sh scripts/release.sh prepare <x.y.z>` opens the version PR when needed; after it merges, run
# the full gate on that `origin/main`, then use `sh scripts/release.sh tag <x.y.z>`.
version = "1.1.0"
license = "Apache-2.0"
repository = "https://github.com/agentcommunity/goal-cup-proxy"
homepage = "https://agentcommunity.org/goalcup"
# 1.99: the latest stable release at the owner's decision of 2026-10-11. The code needs
# less (atomic `try_update`); locked dependencies need 1.88. Clippy's
# incompatible_msrv lint enforces this.
rust-version = "1.99"

# Lighter debug info for dev and test builds (the test profile inherits dev): file:line in
# panics and backtraces, without full DWARF. Smaller target dir, faster links. Release builds
# are untouched.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The regex engine and its search helpers, optimised in dev and test builds. The masker
# (`goalcup`'s `mask`) runs every byte through `regex::bytes`, and unoptimised regex makes
# seeded masking tests several times slower, enough to pass nextest's time limit on a small
# runner. Debug assertions and overflow checks stay on.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.aho-corasick]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

# Compression, hashing and decoding, optimised in dev and test builds for the same reason: at
# opt-level 0 the zstd C library (`zstd-sys`) and `sha2` make long-window compression in tests
# slow, and `brotli-decompressor` and the deflate backend (`miniz_oxide`, under `flate2`) decode
# every recorded body. Debug assertions and overflow checks stay on.
[profile.dev.package.zstd-sys]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.brotli-decompressor]
opt-level = 3

[profile.dev.package.miniz_oxide]
opt-level = 3

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
# The part files (`goalcup-format`), read back by the verifier, and the proxy's `zstd`
# content decoding (`goalcup`'s `proxy::decode`). The C library through `zstd-sys`, built by
# `cc`.
zstd = { version = "0.13", default-features = false }
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
# The uploader's HTTP client (`goalcup`'s `upload`). A blocking HTTP/1.1 client and nothing
# more. `default-features = false` drops ureq's own TLS stack and its gzip decoder: TLS goes
# through ureq's connector hook on the rustls below.
ureq = { version = "2", default-features = false }
# The OS calls std does not have (descriptors, process and signal identity), made through
# one shared version.
libc = "0.2"
# The masking rules (`goalcup`'s `mask`) and the verifier's secret scan
# (`goalcup-verify/src/secrets.rs`). `regex` is the only crate in this tree that compiles one,
# and the regexes of the connector manifests are written in its syntax.
regex = "1"
# Base64 for the proxy, the masker and the verifier.
base64 = "0.22"
# The runtime under the proxy's listeners. No `fs`: filesystem I/O is `std::fs`.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
# The recording proxy (`goalcup`'s `proxy`), run in-process. TLS termination and upstream TLS
# use rustls with the `ring` provider only: `default-features = false` keeps the aws-lc
# provider and its C build out of the tree, and `ring` is the only provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# Upstream TCP keepalive and linger on the proxy's provider-facing sockets
# (`goalcup`'s `proxy::connect`) and the watchdog's socket (`watchdog::spawn`). Already in the
# graph through tokio, which enables the same `all` feature, so this names a crate that is
# compiled either way and adds none.
socket2 = { version = "0.6", features = ["all"] }
# The per-launch, process-scoped CA and its leaf certificates. `pem` writes the one CA file a
# harness is pointed at through its own process-scoped variable; never system trust.
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Validation roots for the proxy's upstream (client-side) TLS.
webpki-roots = "1"
# The `Sec-WebSocket-Accept` derivation (RFC 6455 section 4.2.2: SHA-1 of the key plus a fixed
# GUID, base64) in `proxy::http1`. The proxy parses WebSocket frames itself, never buffering a
# whole message, so no WebSocket library is linked.
sha1 = "0.11"
# HTTP content decoding and permessage-deflate, on the pure-Rust `miniz_oxide` backend only.
# Its fixed 15-bit window is the strategy the proxy uses; the zlib-only window-size
# constructors do not exist in this build and must not be called.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# HTTP `br` content decoding in `proxy::decode`: Anthropic answers brotli whenever a request
# offers it. Decode only and pure Rust (no encoder, no C). `default-features = false` leaves out
# its `std` allocator crate (`alloc-stdlib`, which ships no licence file); `proxy::decode`
# supplies the few lines of allocator itself.
brotli-decompressor = { version = "5", default-features = false }
# Tests only: parse the certificates the proxy mints.
x509-parser = "0.18"
