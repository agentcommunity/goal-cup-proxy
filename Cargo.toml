[workspace]
resolver = "3"
members = [
    "crates/goalcup-cli",
    "crates/goalcup-daemon",
    "crates/goalcup-platform",
    "crates/goalcup-protocol",
    "crates/goalcup-verifier",
]

[workspace.package]
edition = "2024"
# The only place a version is written. Every crate inherits it (`version.workspace = true`), and
# the binaries and report fields read it through `env!("CARGO_PKG_VERSION")`. Change it with
# `sh scripts/release.sh <x.y.z>`; `scripts/check-version.py` (run by the gate) fails on any
# other hard-coded copy.
version = "0.6.0"
license = "Apache-2.0"
# 1.99: the latest stable release at the owner's decision of 2026-10-11. The code needs
# less (atomic `try_update`); locked dependencies need 1.88. Clippy's
# incompatible_msrv lint enforces this.
rust-version = "1.99"

# Lighter debug info for dev and test builds (the test profile inherits dev): file:line in
# panics and backtraces, without full DWARF. Smaller target dir, faster links. Release builds
# are untouched.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The regex engine and its search helpers, optimised in dev and test builds. The daemon's
# redactor runs every byte through `regex::bytes`, and unoptimised they made the seeded
# redaction tests 4 to 9 times slower: on a 4-vCPU x86_64 runner two of them passed nextest's
# 180 s limit. Debug assertions and overflow checks stay on; the workspace's own crates stay
# unoptimised.
[profile.dev.package.regex]
opt-level = 3

[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

[profile.dev.package.aho-corasick]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
sha2 = "0.10"
hex = "0.4"
# The upload chunks (`goalcup-cli`'s `upload::uploader`): one zstd frame per chunk, at the
# library's default level, no long window. The C library through `zstd-sys`, built by `cc`.
zstd = { version = "0.13", default-features = false }
ed25519-dalek = "2"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
# The CLI's control-API client (`goalcup-cli`). A blocking HTTP/1.1 client and nothing more.
# `default-features = false` drops ureq's rustls stack and its gzip decoder: the client speaks
# only to 127.0.0.1, so it links no TLS at all.
ureq = { version = "2", default-features = false }
# The entry registry.
redb = "2"
# The OS calls std does not have (free space, process and signal identity), made through
# one shared version.
libc = "0.2"
# `OsRng` for the run signing seed in `RunKeys` and the control and ingest secrets.
rand = "0.8"
# The redaction pattern set (`goalcup-daemon/src/redact.rs`). R10's set is regular
# expressions and nothing else; `regex` is the only crate in this tree that compiles one,
# and the connector manifests carry participant-visible `extra_patterns[]` written in its
# syntax.
regex = "1"
# Base64 for the redactor, the proxy and the verifier.
base64 = "0.22"
# The hook receiver and the control endpoint. One TCP listener per surface, loopback only;
# `default-features = false` because this tree wants none of axum's optional extractors and, in
# particular, none of its `tracing` integration.
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
# The runtime under those listeners. No `fs`: filesystem I/O is `std::fs` on the polling
# thread, which is the only thread allowed to touch a participant's disk.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }
# M2 recorder. The recording proxy is `goalcup-cli`'s `proxy` module (run in-process by
# `goalcup start --goal-file`); nothing below is linked by the daemon. TLS termination and upstream
# TLS use rustls with the `ring` provider only: `default-features = false` keeps the aws-lc
# provider and its C build out of the tree, and `ring` is the only
# provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The per-launch, process-scoped CA and its leaf certificates. `pem` writes the one CA file a
# harness is pointed at through its own process-scoped variable; never system trust.
# Upstream TCP keepalive on the proxy's provider-facing sockets (`goalcup-cli`'s
# `proxy::connect`). Already in the graph through tokio, which enables the same `all` feature,
# so this names a crate that is compiled either way and adds none.
socket2 = { version = "0.6", features = ["all"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem"] }
# Validation roots for the proxy's upstream (client-side) TLS.
webpki-roots = "1"
# The `Sec-WebSocket-Accept` derivation (RFC 6455 section 4.2.2: SHA-1 of the key plus a fixed
# GUID, base64) in `proxy::http`. The proxy parses WebSocket frames itself, never buffering a
# whole message, so no WebSocket library is linked.
sha1 = "0.11"
# HTTP content decoding and permessage-deflate, on the pure-Rust `miniz_oxide` backend only.
# Its fixed 15-bit window is the strategy the proxy uses; the zlib-only window-size
# constructors do not exist in this build and must not be called.
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Tests only: parse the certificates the proxy mints.
x509-parser = "0.18"
