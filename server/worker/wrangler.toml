# Goal Cup upload Worker. Contract: docs/UPLOAD-API.md. Design: docs/SERVER-DESIGN.md.
#
# Nothing in this file names a real Cloudflare account or resource. The owner fills in the
# placeholders below when deploying (see README.md, "What the owner must create before deploying").
# No `account_id` on purpose: wrangler takes it from the owner's login or CLOUDFLARE_ACCOUNT_ID.

name = "goalcup-upload"
main = "src/index.ts"
compatibility_date = "2026-10-01"

# Served only on the custom domain, never on a *.workers.dev address.
workers_dev = false
preview_urls = false

# Custom domain (owner decides the name; needs the zone on the same Cloudflare account):
# routes = [{ pattern = "ingest.example.org", custom_domain = true }]

[[r2_buckets]]
binding = "TRACES"
# PLACEHOLDER: the private bucket the owner creates (with a 180-day bucket lock).
bucket_name = "replace-me-goalcup-traces"
# `wrangler dev` runs against a local simulation of R2, so this name is not used there.
preview_bucket_name = "replace-me-goalcup-traces-preview"

[vars]
# Which event new competition runs belong to, and which one practice runs belong to. Until the
# website's `goalcup.events` table is wired in, one Worker deployment serves one of each.
EVENT_ID = "competition"
PRACTICE_EVENT_ID = "practice"
# Run length in hours. There is no grace period: at `deadline_at` the run is over.
RUN_HOURS = "168"
# A practice run lasts this many minutes. Practice has no start window and never replaces a run.
PRACTICE_RUN_MINUTES = "10"
# Production default. `local` exists for `wrangler dev` and tests only (see README).
DB_BACKEND = "supabase"
# Check with the GitHub API that repo_url is a public repository. "on" in production;
# `npm run dev` and the tests turn it off so they need no network.
GITHUB_CHECK = "on"
# PLACEHOLDER: the website's page where a member approves a device request (no query string).
# The tracer opens it with `?code=<user code>`.
APPROVAL_URL = "https://example.org/goalcup/approve"
# Set to "on" and redeploy to make every call answer 503 + Retry-After.
MAINTENANCE = "off"
MAINTENANCE_RETRY_AFTER = "300"
# Sender of the run emails (src/mail.ts); mail stays off until the RESEND_API_KEY secret is set.
NOTICE_FROM = "Agent Community <updates@member.agentcommunity.org>"

# Secrets, set with `wrangler secret put` (never in this file):
#   RECEIPT_SIGNING_KEY  Ed25519 seed, 64 hex characters, generated offline
#   SUPABASE_URL         https://<project>.supabase.co
#   SUPABASE_KEY         a Supabase secret API key whose role may only execute public.goal_cup_upload_*
#   RESEND_API_KEY       optional: switches the run emails on (the website's Resend account)
#   GITHUB_TOKEN         read-only; required in production and staging (the cron's commit fetch fails without it)
#   TEST_APPROVAL_KEY    never in production. Staging only (with STAGING = "on"): switches on
#                        POST /v1/device/approve, which approves a device request as any member.

# The 5-minute cron (src/notices.ts): closes runs that are over, records the GitHub commit at each
# deadline, queues the run emails into the outbox. Staging repeats it below.
[triggers]
crons = ["*/5 * * * *"]

# Staging: `wrangler deploy --env staging` makes a second Worker, goalcup-ingest-staging, on its own
# bucket and its own events. It is the only deployment that may hold TEST_APPROVAL_KEY (a secret,
# set with `wrangler secret put TEST_APPROVAL_KEY --env staging`, never in this file). wrangler
# copies neither `vars` nor `r2_buckets` into an environment, so staging repeats every one.
# Deployed 2026-10-15 on the Agent Community Cloudflare account (pass CLOUDFLARE_ACCOUNT_ID), served
# at https://goalcup-ingest-staging.b-9a5.workers.dev (staging only; production stays off workers.dev).
[env.staging]
name = "goalcup-ingest-staging"
workers_dev = true
preview_urls = false

[env.staging.triggers]
crons = ["*/5 * * * *"]

[[env.staging.r2_buckets]]
binding = "TRACES"
# A private bucket of its own, never the production one. No bucket lock on staging.
bucket_name = "goalcup-traces-staging"
preview_bucket_name = "goalcup-traces-staging"

[env.staging.vars]
STAGING = "on"
# Rows of goal_cup_tracer.events (website migration 20261015120100_goal_cup_tracer_staging_events.sql).
EVENT_ID = "goalcup-dryrun-staging"
PRACTICE_EVENT_ID = "goalcup-practice-staging"
RUN_HOURS = "168"
PRACTICE_RUN_MINUTES = "10"
DB_BACKEND = "supabase"
GITHUB_CHECK = "on"
# The website's approval page (agentcommunity.org; it signs the member in with the site's session).
APPROVAL_URL = "https://agentcommunity.org/goalcup/approve"
MAINTENANCE = "off"
MAINTENANCE_RETRY_AFTER = "300"
NOTICE_FROM = "Agent Community <updates@member.agentcommunity.org>"
# Staging never emails a member: every notice goes to Resend's test inbox.
NOTICE_RECIPIENT_OVERRIDE = "delivered@resend.dev"
