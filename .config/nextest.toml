# cargo-nextest settings for `sh scripts/gate.sh`. One process per test, run in parallel.
[profile.default]
fail-fast = false
retries = 0
# A test slower than 30 s is flagged; it is killed after six such periods (180 s).
slow-timeout = { period = "30s", terminate-after = 6 }

[profile.default.junit]
path = "junit.xml"

# Binaries that kill processes, change limits or open thousands of descriptors run one at a time.
# Each joins `binary(/^(native_walk|...)$/)` below, never a second block, in the merge that brings
# its heavy case (nextest refuses a filter matching no binary): watchdog_*, e2e_*, proxy_restart,
# lessons_launch, pipeline_{restart,stall,many_streams}, proxy_connect (PRD-03's 2,000 connections).
# End-to-end binaries also get slow-timeout = { period = "60s", terminate-after = 10 }.
[[profile.default.overrides]]
filter = 'binary(/^native_walk$/)'
test-group = 'heavy'

[test-groups]
heavy = { max-threads = 1 }
