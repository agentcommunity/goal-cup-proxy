# cargo-nextest settings for `sh scripts/gate.sh`. One process per test, run in parallel.
# Install once: cargo install cargo-nextest --locked
[profile.default]
# Report every failure in one run instead of stopping at the first.
fail-fast = false
# A test slower than 30 s is flagged; it is killed after six such periods (180 s).
slow-timeout = { period = "30s", terminate-after = 6 }
test-threads = "num-cpus"

# The longest single tests of the fast tier start first, so the gate's wall time is not their
# run added to everything scheduled before them: the kit run (every kit case, one after another)
# and the slow serial capture test. The long P1 redaction loops are split into parts that run in
# parallel (`shards!` in crates/goalcup-daemon/tests/common/support/redaction.rs).
[[profile.default.overrides]]
filter = '''
(package(goalcup-cli) & binary(it) & test(=harness_contract_kit::every_kit_case_seals_and_matches_expectations))
| (package(goalcup-daemon) & binary(it) & test(=capture_lifecycle::a_slow_harness_hash_loses_and_delays_no_traffic))
'''
priority = 100

# Some suites serialise through an in-process lock (the process-table `TableLock` in
# crates/goalcup-daemon/tests/common/support/table_lock.rs, and capture_gate's static Mutex).
# Under nextest every test is its own process, so those locks hold nothing; this group restores
# one-at-a-time for exactly those modules.
[test-groups]
serial = { max-threads = 1 }
# The two suites that run connectors through the real binaries, one at a time. Every kit stand-in
# that writes twice now waits for the runner to see its first write before it makes the second
# (the `@GO@` file), so no case should depend on the clock, and the group should no longer be
# needed for correctness. That rests on five of five runs with the group off under load, which is
# not proof. The group is kept for that reason, and to spare the CPU: each run starts a daemon, a
# proxy and a Python child.
connector-runs = { max-threads = 1 }

[[profile.default.overrides]]
filter = '''
package(goalcup-daemon) & (
    (binary(it) & test(/^(capture_lifecycle|capture_deferred_scope|capture_harness_load|harness_contract_golden)::/))
    | (binary(full) & test(/^(capture_finish_budget|process_kill)::/))
)
'''
test-group = 'serial'

[[profile.default.overrides]]
filter = '''
package(goalcup-cli) & (
    (binary(it) & test(/^(capture_gate|process_handoff|preflight_doctor)::/))
    | (binary(full) & test(/^(launcher_sweep|capture_crash_campaign|capture_failure_campaign|per_run_lifecycle|m2_synthetic_vertical)::/))
    | binary(m2_cli_lifecycle)
)
'''
test-group = 'serial'

[[profile.default.overrides]]
filter = '''
package(goalcup-cli) & (
    (binary(it) & test(/^harness_contract_kit::every_kit_case/))
    | (binary(full) & test(/^connector_contract::/))
)
'''
test-group = 'connector-runs'
