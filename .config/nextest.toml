# cargo-nextest settings for `sh scripts/gate.sh`. One process per test, run in parallel.
[profile.default]
fail-fast = false
retries = 0
# A test slower than 30 s is flagged; it is killed after six such periods (180 s).
slow-timeout = { period = "30s", terminate-after = 6 }

[profile.default.junit]
path = "junit.xml"

# Binaries that kill processes, change limits or open thousands of descriptors run one at a time.
# Each joins this regex in the merge that brings it (nextest refuses a filter that matches no
# binary): watchdog_*, e2e_*, lessons_launch, pipeline_restart, pipeline_stall,
# pipeline_many_streams, proxy_connect, proxy_restart. End-to-end binaries also get
# slow-timeout = { period = "60s", terminate-after = 10 }.
[[profile.default.overrides]]
filter = 'binary(/^native_walk$/)'
test-group = 'heavy'

[test-groups]
heavy = { max-threads = 1 }
