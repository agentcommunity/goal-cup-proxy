# cargo-nextest settings for `sh scripts/gate.sh`. One process per test, run in parallel.
[profile.default]
fail-fast = false
retries = 0
# A test slower than 30 s is flagged; it is killed after six such periods (180 s).
slow-timeout = { period = "30s", terminate-after = 6 }

[profile.default.junit]
path = "junit.xml"

# Binaries that kill processes, change limits or open thousands of descriptors run one at a time.
# Each joins `binary(/^(native_walk|watchdog_rlimit|...)$/)` below, never a second block, in the merge
# that brings its heavy case (nextest refuses a filter matching no binary). Still to come: e2e_*,
# pipeline_restart, pipeline_many_streams.
# End-to-end binaries also get slow-timeout = { period = "60s", terminate-after = 10 }.
[[profile.default.overrides]]
filter = 'binary(/^(native_walk|watchdog_rlimit|watchdog_end|watchdog_null|watchdog_recover|watchdog_restart|watchdog_shield|proxy_connect|proxy_restart|lessons_launch|pipeline_stall|pipeline_guard)$/)'
test-group = 'heavy'

# pipeline_stall runs a stalled recorder end to end for over a minute, so it has the end-to-end slow-timeout.
[[profile.default.overrides]]
filter = 'binary(pipeline_stall)'
slow-timeout = { period = "60s", terminate-after = 10 }

[test-groups]
heavy = { max-threads = 1 }
