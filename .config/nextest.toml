# cargo-nextest settings for `sh scripts/gate.sh`. One process per test, run in parallel.
[profile.default]
fail-fast = false
retries = 0
# A test slower than 30 s is flagged; it is killed after six such periods (180 s).
slow-timeout = { period = "30s", terminate-after = 6 }

[profile.default.junit]
path = "junit.xml"

# Tests that kill processes, change limits or open thousands of descriptors, one at a time.
# A builder who adds such a test binary adds its name here.
[test-groups]
heavy = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(/^(watchdog_.*|e2e_.*|lessons_launch|pipeline_restart|pipeline_stall|pipeline_many_streams|proxy_connect|proxy_restart|native_walk)$/)'
test-group = "heavy"

# End-to-end tests may run 600 s.
[[profile.default.overrides]]
filter = 'binary(/^e2e_/)'
slow-timeout = { period = "60s", terminate-after = 10 }
