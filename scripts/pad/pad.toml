# The test pad's own settings (PRD-12 sections 1, 7 and "Overridable defaults").
# No server address here: the staging Worker and loopback are fixed in `pad` (ledger B4).
cap_usd = 10              # per run, ledger T6: at this estimate the spend check seals the run
spend_every_min = 5       # the live spend check (section 7)
per_key = 2               # sandboxes at once per provider key
per_key_deepseek = 6      # back to per_key once a row's 429 share passes 5%
box_vcpus = 4
box_extra_minutes = 30    # box timeout is the run's minutes plus this
build = "pad-out/build"   # goalcup and goalcup-verify from the build box output, copied to ~/bin in the box

# Key name in a settings file -> the conductor environment variable that holds it.
# Names only, each a *_API_KEY: the pad never reads a value, sbx.mjs put-env reads it inside node.
[keys]
claude = "CLAUDE_API_KEY"
openai = "OPENAI_API_KEY"
deepseek = "DEEPSEEK_API_KEY"
gemini = "GEMINI_API_KEY"
gateway = "AI_GATEWAY_API_KEY"

# USD per million tokens (section 7), copied from each vendor's pricing page on 30 Oct 2026 (the commit cites them),
# tiers taken: DeepSeek peak, Anthropic 1 h cache writes, Haiku over 100k, OpenAI short context (up to 272K).
# A model with no line is priced at the highest rate of its key. AI Gateway charges the provider's list price.
[rates]
"claude-opus-5-5" = { key = "claude", input = 4, cached = 0.2, cache_write = 8, output = 20 }
"claude-sonnet-5-5" = { key = "claude", input = 2, cached = 0.1, cache_write = 4, output = 10 }
"claude-haiku-5-5" = { key = "claude", input = 0.5, cached = 0.05, cache_write = 1, output = 2.5 }
"gpt-6-astra" = { key = "openai", input = 10, cached = 1, cache_write = 12.5, output = 50 }
"gpt-6.1-sol" = { key = "openai", input = 2, cached = 0.1, cache_write = 2.5, output = 10 }
"deepseek-flash" = { key = "deepseek", input = 0.3, cached = 0.006, output = 1.2 }
"gemini-4-argon" = { key = "gemini", input = 2, cached = 0.1, output = 10 }  # doubles from 1 Dec 2026
"openai/gpt-6-astra" = { key = "gateway", input = 10, cached = 1, cache_write = 12.5, output = 50 }
