# core-claude-code-signin.toml: Claude Code direct and dodger (case all skips gateway) on the owner's Claude sign-in, no API key (gateway rows: core-claude-code.toml).
# Sign in once: GOALCUP_HOME=~/gc-signin/home goalcup setup --harness claude-code-cli
# Claude Code on macOS keys its Keychain login by the config dir path, so this path must not change.
harness = "claude-code-cli"
key = "none"
case = "all"
mode = "full"
where = "here"
goalcup_home = "~/gc-signin/home"
box_extra_minutes = 10
# Signed in already: only the folder trust screen shows (default "No, exit"): Down, Enter.
pre_keys = ['\033[B\r']
