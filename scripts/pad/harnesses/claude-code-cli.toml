# Pad data for Claude Code (PRD-12 section 6): test data, never connector data; goalcup never reads it.
# Vendor pages read 30 Oct 2026: https://code.claude.com/docs/en/setup (npm install of an exact version),
# https://code.claude.com/docs/en/authentication (ANTHROPIC_API_KEY; interactive mode asks once to use it),
# https://vercel.com/docs/ai-gateway/coding-agents/claude-code (gateway: base URL, ANTHROPIC_AUTH_TOKEN).
# Model pin (owner rule 1 Nov 2026), https://code.claude.com/docs/en/model-config (ANTHROPIC_MODEL; --model is also an option, unused) and
# https://code.claude.com/docs/en/env-vars (ANTHROPIC_SMALL_FAST_MODEL is DEPRECATED, ANTHROPIC_DEFAULT_HAIKU_MODEL sets the
# background model; ANTHROPIC_DEFAULT_SONNET_MODEL and ANTHROPIC_DEFAULT_OPUS_MODEL decide what the `sonnet` and `opus` aliases
# resolve to, so a subagent spawned with either alias still runs Haiku): all set to Haiku 5.5 so no run falls back to the default Opus. Gateway id spelling is from the task brief;
# vercel.com was not reachable when this was written, so the first gateway run confirms it.
version = "2.1.312"
version_cmd = "claude --version"
install = "npm i -g @anthropic-ai/claude-code@2.1.312"
key_kind = "claude"
key_route = "env"
key_env = "ANTHROPIC_API_KEY"
# Pad data for the dodger copy only (section 2): the host of the direct case's model calls (ANTHROPIC_API_KEY).
model_host = "api.anthropic.com"
# One item per first-run screen, sent in order. The last is "Yes, I trust this folder" (measured on 2.1.283, docs/harnesses/claude-code-cli.md section 10).
# On 2.1.312 the theme, API key and security notes screens come first (probed on a real run).
pre_keys = ['\r', '\033[A\r', '\r', '\033[B\r']  # probed on 2.1.312: theme Enter; API key Up, Enter (Yes); security notes Enter; trust Down, Enter
exit_keys = '/exit\r'
keep_going = true

[direct]
model = "claude-haiku-5-5"
env = { ANTHROPIC_MODEL = "claude-haiku-5-5", ANTHROPIC_DEFAULT_HAIKU_MODEL = "claude-haiku-5-5", ANTHROPIC_DEFAULT_SONNET_MODEL = "claude-haiku-5-5", ANTHROPIC_DEFAULT_OPUS_MODEL = "claude-haiku-5-5" }

[gateway]
model = "anthropic/claude-haiku-5.5"
env = { ANTHROPIC_MODEL = "anthropic/claude-haiku-5.5", ANTHROPIC_DEFAULT_HAIKU_MODEL = "anthropic/claude-haiku-5.5", ANTHROPIC_DEFAULT_SONNET_MODEL = "anthropic/claude-haiku-5.5", ANTHROPIC_DEFAULT_OPUS_MODEL = "anthropic/claude-haiku-5.5" }
files = { "settings.json" = "gateway/claude-code-settings.json" }
key_route = "env"
key_env = "ANTHROPIC_AUTH_TOKEN"
# With ANTHROPIC_AUTH_TOKEN there is no API-key screen: theme Enter, security notes Enter, trust Down+Enter, then the
# "Make auto mode your default permission mode?" screen Down+Enter (No), seen on the rung 7 run.
pre_keys = ['\r', '\r', '\033[B\r', '\033[B\r']
