# Pad data for Claude Code (PRD-12 section 6): test data, never connector data; goalcup never reads it.
# Vendor pages read 30 Oct 2026: https://code.claude.com/docs/en/setup (npm install of an exact version),
# https://code.claude.com/docs/en/authentication (ANTHROPIC_API_KEY; interactive mode asks once to use it),
# https://vercel.com/docs/ai-gateway/coding-agents/claude-code (gateway: base URL, ANTHROPIC_AUTH_TOKEN).
version = "2.1.312"
version_cmd = "claude --version"
install = "npm i -g @anthropic-ai/claude-code@2.1.312"
key_kind = "claude"
key_route = "env"
key_env = "ANTHROPIC_API_KEY"
# Pad data for the dodger copy only (section 2): the host of the direct case's model calls (ANTHROPIC_API_KEY).
model_host = "api.anthropic.com"
# Down, Enter: "Yes, I trust this folder" (measured on 2.1.283, docs/harnesses/claude-code-cli.md section 10).
# The once-only "use this API key?" question and any first-run screen are unmeasured on 2.1.312.
pre_keys = '\033[B\r'
exit_keys = '/exit\r'
keep_going = true

[gateway]
files = { "settings.json" = "gateway/claude-code-settings.json" }
key_route = "env"
key_env = "ANTHROPIC_AUTH_TOKEN"
