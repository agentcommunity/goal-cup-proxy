# Hermes with its native DeepSeek provider (ledger T2); the key is DEEPSEEK_API_KEY in {home}/.env.
model:
  provider: deepseek
  default: deepseek-flash
# The "Help improve Hermes?" answer, preset to "No thanks" (shared_metrics_consent.py at v0.22.5; docs only, not run).
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
