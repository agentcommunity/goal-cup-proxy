# Pad data for Crush (PRD-12 section 6): test data, never connector data; goalcup never reads it.
# Vendor pages read 31 Oct 2026: https://github.com/charmbracelet/crush/blob/v0.99.0/README.md (npm i -g @charmland/crush,
# custom provider type "completions" with base_url, "$VAR" in api_key, DeepSeek at https://api.deepseek.com/v1 with
# DEEPSEEK_API_KEY, VERCEL_API_KEY for the Vercel AI Gateway). The README names no config path for crush.json and no quit key.
# Permission answers: Sweep 2 showed Crush stops at "Permission Required: Allow / Allow for Session / Deny". The v0.99.0
# README gives the setting only as crushrc commands ("permissions allow view ls grep edit ...", in ./.crushrc or
# ~/.config/crush/crushrc) or the --yolo flag, and no JSON key. The pad answers the dialog with the crushrc data file
# below, in both cases.
# Init screen "Would you like to initialize this project? Yep! / Nope": the README (main, read 2 Nov 2026) names no option that skips
# it (crushrc options: initialize-as only sets the file name), so a participant running unattended answers Nope with the key n,
# sent as a pre key before the prompt, and only once ready_text (the dialog's question) is on screen: if the dialog is absent the
# pad sends no key, so no stray n lands in the chat input. UNPROVEN until a live Crush row: the key n and the ready_text are read
# from the dialog's labels, not from the docs, and Nope may need arrow keys and Enter instead.
# Read from docs only, not run against a live harness: every key below, the "models" selection block, the model ids and
# the quit key (Ctrl-C twice is a guess).
version = "0.99.0"
version_cmd = "crush --version"
install = "npm i -g @charmland/crush@0.99.0"
key_kind = "deepseek"
key_route = "env"
key_env = "DEEPSEEK_API_KEY"
# Pad data for the dodger copy only (section 2): the custom provider calls https://api.deepseek.com.
model_host = "api.deepseek.com"
exit_keys = '\003\003'
ready_text = "initialize this project"
pre_keys = 'n'
keep_going = true

[direct]
model = "deepseek-flash"
# XDG_CONFIG_HOME is {home}/.config, so this is Crush's global crush.json.
files = { ".config/crush/crush.json" = "direct/crush-cli-config.json", ".config/crush/crushrc" = "direct/crush-cli-crushrc" }

[gateway]
model = "deepseek/deepseek-v4.1-flash"
files = { ".config/crush/crush.json" = "gateway/crush-cli-config.json", ".config/crush/crushrc" = "direct/crush-cli-crushrc" }
key_route = "env"
key_env = "VERCEL_API_KEY"
