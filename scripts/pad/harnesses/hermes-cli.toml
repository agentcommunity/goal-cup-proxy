# Pad data for Hermes Agent (PRD-12 section 6): test data, never connector data; goalcup never reads it.
# Vendor pages read 30 Oct 2026: https://hermes-agent.nousresearch.com/docs/getting-started/installation (installer,
# ~/.local/bin/hermes), https://github.com/NousResearch/hermes-agent/releases (v0.22.5 is commit bf0203a794),
# scripts/install.sh at v0.22.5 (--skip-setup, --commit), hermes_cli/auth.py at v0.22.5 (provider "deepseek" reads
# DEEPSEEK_API_KEY, provider "ai-gateway" reads AI_GATEWAY_API_KEY), https://api-docs.deepseek.com/quick_start/pricing.
# Slice 13 (P4), vendor source read 1 Nov 2026 (hermes-agent.nousresearch.com did not resolve from the writing session):
# hermes_cli/observability/shared_metrics_consent.py at v0.22.5 (the "Help improve Hermes?" offer is skipped once
# telemetry.shared_metrics has "enabled" or "send" and offer_version 2 in config.yaml; both config yaml files now preset it).
# Measured in the rung 1x run (REPORT item 5): the first run installs Python dependencies per HERMES_HOME (about a minute),
# then the telemetry screen eats the paste; Enter takes "No thanks" and about 15 s are needed before the chat TUI takes input.
# Docs only, not run: the config.yaml preset. The pad waits at most 30 s for ready_text (pad-run type_prompt), so the empty
# pre_keys items below add idle time (3 s each) in case the dependency install outlasts it; ready_text stays as the fallback
# for a screen that still appears. The first rung run after this change settles whether the preset skips the screen.
version = "0.22.5"
version_cmd = "hermes --version"
install = "curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/v0.22.5/scripts/install.sh | bash -s -- --skip-setup --skip-browser --skip-computer-use --commit bf0203a794a07aac3ff764972ab9087baa4e4f4e"
key_kind = "deepseek"
key_route = "file"
key_file = "{home}/.env"
key_line = "DEEPSEEK_API_KEY={key}"
# Pad data for the dodger copy only (section 2): [direct] provider deepseek calls https://api.deepseek.com.
model_host = "api.deepseek.com"
ready_text = "Help improve Hermes?"
pre_keys = ['\r', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '', '']
exit_keys = '/exit\r'
daemon = "hermes gateway run"
keep_going = true

[direct]
files = { "config.yaml" = "direct/hermes-config.yaml" }

[gateway]
files = { "config.yaml" = "gateway/hermes-config.yaml" }
key_route = "file"
key_file = "{home}/.env"
key_line = "AI_GATEWAY_API_KEY={key}"
