# Pad data for Hermes Agent (PRD-12 section 6): test data, never connector data; goalcup never reads it.
# Vendor pages read 30 Oct 2026: https://hermes-agent.nousresearch.com/docs/getting-started/installation (installer,
# ~/.local/bin/hermes), https://github.com/NousResearch/hermes-agent/releases (v0.22.5 is commit bf0203a794),
# scripts/install.sh at v0.22.5 (--skip-setup, --commit), hermes_cli/auth.py at v0.22.5 (provider "deepseek" reads
# DEEPSEEK_API_KEY, provider "ai-gateway" reads AI_GATEWAY_API_KEY), https://api-docs.deepseek.com/quick_start/pricing.
# Measured: the first run installs Python dependencies per HERMES_HOME (about a minute). The config.yaml preset in
# direct/hermes-config.yaml removes the telemetry screen in the direct case only (measured in sweep 2: no "Help improve Hermes?" screen, the chat banner
# "Type your message or /help" shows and the paste lands), so no key press is needed before the prompt. The gateway
# preset (gateway/hermes-config.yaml) has been run since (gateway smoke gw3, 1 Nov 2026): no telemetry screen, ready text seen, paste landed.
version = "0.22.5"
version_cmd = "hermes --version"
tier_note = "subagents shown by their task logs, not tied to individual calls"
install = "curl -fsSL https://raw.githubusercontent.com/NousResearch/hermes-agent/v0.22.5/scripts/install.sh | bash -s -- --skip-setup --skip-browser --skip-computer-use --commit bf0203a794a07aac3ff764972ab9087baa4e4f4e"
key_kind = "deepseek"
key_route = "file"
key_file = "{home}/.env"
key_line = "DEEPSEEK_API_KEY={key}"
# Pad data for the dodger copy only (section 2): [direct] provider deepseek calls https://api.deepseek.com.
model_host = "api.deepseek.com"
# Basis, stated plainly: https://hermes-agent.nousresearch.com/docs/user-guide/security, section "Credential Redaction", says
# error messages from MCP tools are sanitized before they go back to the LLM, matches replaced by [REDACTED], for GitHub
# tokens (ghp_...), OpenAI-style keys (sk-...), Bearer tokens and token=/key=/API_KEY=/password=/secret= parameters. It names no
# redaction of ordinary tool output and no jwt, private_key or url_password shape; docs/harnesses/hermes-cli.md:28 (redacted
# delegation task logs) is about Hermes's own log files. check.py reads the flag as: with no hit and no stated loss, a planted
# kind with no MASK is a C3 PASS "masked upstream" only when the run shows the exercise (a masked_key MASK, the masker's rule
# for Hermes's own redacted form; the full3 record held 28 and 190), else C3 stays INCONCLUSIVE. Such a PASS does not count
# toward --release-check until the owner confirms the rule (point 4). pad copies this to the row meta under the same name.
redacts_tool_output = true
# The planted kinds the vendor rule above names (sk- and ghp_ shapes); only these can pass as masked upstream.
redacts_kinds = ["openai_key", "github_token"]
ready_text = "Type your message or /help"
ready_wait = 120
exit_keys = '/exit\r'
daemon = "hermes gateway run"
keep_going = true

[direct]
model = "deepseek-flash"
files = { "config.yaml" = "direct/hermes-config.yaml" }

[gateway]
model = "deepseek/deepseek-v4.1-flash"
files = { "config.yaml" = "gateway/hermes-config.yaml" }
key_route = "file"
key_file = "{home}/.env"
key_line = "AI_GATEWAY_API_KEY={key}"
