# CI runs the gate, nothing less: `sh scripts/gate.sh fast`, the same command a build box runs
# before every merge (README.md, "The gate"), split into its parts as parallel jobs: `lint` (fmt,
# clippy), `rust` (nextest in three hash shards) and `rest` (doctests, Worker, scripts, pad, links,
# paths). `check` is the one required status: green only when every part passed. No scope step,
# no path filter: every pull request gets a completed `check`. Swatinem/rust-cache restores the
# build, keyed by Cargo.lock and toolchain; only a push to main saves it.
# Only a superseded pull request run is cancelled. Each push has a group of its own (its sha), so
# every push to main runs to the end.
#
# A test that hangs the runner moves to the full tier (the night log names it); CI is never
# narrowed by crate.
#
# It holds no secret and runs with a read-only token, so a pull request from a fork can run it.
# Keep it that way: never use `pull_request_target`, and never pass a secret to a step.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # A fresh runner never reuses incremental artifacts; they only eat disk.
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # Build scripts run PR code; keep the token out of .git/config.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The one compiler: with no arguments rustup installs what rust-toolchain.toml names,
      # components included.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: sh scripts/gate.sh fast --part lint

  rust:
    name: rust (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # The shards build the same binaries; shard 1 on main saves the cache, all restore it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust
          save-if: ${{ matrix.shard == 1 && github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest@0.9.148
      - run: sh scripts/gate.sh fast --part rust --partition ${{ matrix.shard }}/3
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-junit-${{ matrix.shard }}
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore

  rest:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # Doctests need the compiler; they restore the shards' cache and never save it.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: rust
          save-if: false
      # The Worker tests run .ts files natively (server/worker/package.json: node >=22.18).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: npm ci --prefix server/worker
      - run: sh scripts/gate.sh fast --part rest

  check:
    name: check
    needs: [lint, rust, rest]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          LINT: ${{ needs.lint.result }}
          RUST: ${{ needs.rust.result }}
          REST: ${{ needs.rest.result }}
        run: |
          echo "lint: $LINT, rust: $RUST, rest: $REST"
          [ "$LINT" = success ] && [ "$RUST" = success ] && [ "$REST" = success ]
