# CI runs the gate, nothing less: one job, `sh scripts/gate.sh fast`, the same command a build box
# runs before every merge (README.md, "The gate"). There is no scope step and no path filter, so
# every pull request gets a completed `check` that can be required.
# Only a superseded pull request run is cancelled; every push to main and v1.0/integration runs to the end.
#
# A test that hangs the runner moves to the full tier (the night log names it); CI is never
# narrowed by crate.
#
# It holds no secret and runs with a read-only token, so a pull request from a fork can run it.
# Keep it that way: never use `pull_request_target`, and never pass a secret to a step.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, v1.0/integration]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # A fresh runner never reuses incremental artifacts; they only eat disk.
      CARGO_INCREMENTAL: 0
    steps:
      # Build scripts and tests run PR code; keep the token out of .git/config.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      # The one compiler: with no arguments rustup installs what rust-toolchain.toml names,
      # components included.
      - run: rustup toolchain install
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: cargo-nextest
      # The Worker tests run .ts files natively (server/worker/package.json: node >=22.18).
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - run: npm ci --prefix server/worker
      - run: sh scripts/gate.sh fast
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextest-junit
          path: target/nextest/default/junit.xml
          if-no-files-found: ignore
