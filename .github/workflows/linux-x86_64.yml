# Manual only: the Linux check on an x86_64 host. Never runs on push or pull request (CI stays
# lean; ci.yml is the only automatic job). Start it from the Actions tab or with
# `gh workflow run linux-x86_64.yml`.
#
# Two independent jobs on ubuntu-24.04, which is x86_64. No secret is used and nobody signs in.
# - linux-check: `sh scripts/linux-check.sh` (README.md, "The gate") with LINUX_CHECK_HARNESSES=1,
#   so after the suites it also runs the harness smoke inside its container.
# - harness-smoke: the smoke alone, on the runner itself: a release build, then
#   scripts/linux-harness-smoke.sh fetches the measured x86_64 Codex and Claude Code builds from
#   npm and launches each with no login to the auth step. It does not wait on the suites, so a
#   suite that fails on this host does not hide the harness result.

name: linux-x86_64

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  linux-check:
    name: linux-check (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: uname -m && docker info --format '{{.NCPU}} CPUs, {{.MemTotal}} bytes, {{.ServerVersion}}' && df -h /
      # The runner's preinstalled SDKs the check never uses; the image and the build need the room.
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      # linux-check.sh builds offline inside the container from the host's registry.
      - run: cargo fetch --locked
      # The container works as uid 1000 (`dev`); the runner's files belong to another uid.
      - run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE" "$HOME/.cargo/registry"
      - env:
          LINUX_CHECK_HARNESSES: "1"
        run: sh scripts/linux-check.sh

  harness-smoke:
    name: harness smoke (x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The run's TMPDIR, runner.temp, must be ext4 or XFS, which capture accepts.
      - run: |
          uname -m && df -h /
          case $(stat -f -c %T "$RUNNER_TEMP") in ext2/ext3 | xfs) ;; *) exit 1 ;; esac
      - run: cargo build --locked --release -p goalcup-cli -p goalcup-daemon -p goalcup-verifier
      - env:
          TMPDIR: ${{ runner.temp }}
        run: |
          export PATH="$GITHUB_WORKSPACE/target/release:$PATH"
          export GOALCUP_CONNECTORS_DIR="$GITHUB_WORKSPACE/connectors"
          sh scripts/linux-harness-smoke.sh
