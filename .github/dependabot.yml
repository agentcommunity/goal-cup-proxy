# Weekly update pull requests. Each one goes through review like any other change: the CI
# `check` job and, before it merges, the gate (README.md, "The gate"). A dependency update to the
# upload Worker ships with the next `wrangler deploy` from main.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /server/worker
    schedule:
      interval: weekly
