# Template for connectors/<HARNESS_ID>/harness.toml (connector schema 1).
# Copy: mkdir -p connectors/<HARNESS_ID> && cp <this file> connectors/<HARNESS_ID>/harness.toml
# Replace every <PLACEHOLDER>. Delete the options you do not use. Comment lines are optional
# (they are pinned bytes too); keep one first-line provenance comment like the shipped ones:
# <Harness name> <VERSION>, capture only. Facts: docs/harnesses/<HARNESS_ID>.md.
# This template is chat mode (D57), the product's mode: the closest complete example is
# connectors/codex-cli/harness.toml (connectors/hermes-cli adds a `configure` command). Headless is
# option B below (example: crates/goalcup-protocol/tests/fixtures/headless-connectors/hermes-cli).
# Field limits: docs/CONNECTOR-SCHEMA.md. Allowed values: docs/HARNESS-ONBOARDING.md, "Do I need a core change?".
# No argument, goal flag, env key or value, host or auth host may name the tracker
# (docs/CONNECTOR-SCHEMA.md, "Cross-field rules", rule 10).

schema_version = 1                      # always 1
id = "<HARNESS_ID>"                     # must equal the folder name; ^[a-z][a-z0-9-]{1,47}$

# How messages to the participant name this harness. Required in practice: without it they
# say the connector id. Plain text only: the strings are printed to a terminal.
[participant]
display_name = "<HARNESS NAME>"         # 1 to 40 printable ASCII characters, as a person says it
# What the harness shows first and what to do about it (a trust or login question). Shown just
# before the harness opens. At most 200 printable ASCII characters, one line. Delete if it asks nothing.
# first_screen = "<HARNESS NAME> may ask <QUESTION>. Choose <ANSWER>."

[capture]
# A) Chat mode (the default): the harness opens in the participant's terminal and the participant
# types the prompt. No goal slot, identity source "none". The sign-in must live in the
# harness's own config home: the tracer never passes an API key (D61).
interactive = true
continuation = "chat: the participant types the prompt and may type keep going"
# The argv WITHOUT the program; may be empty. Templates allowed in values: {workspace}. No
# absolute paths. No model, effort, approval or sandbox option: those are the participant's.
args = []
# How `goalcup continue` reopens the most recent session, appended after args (for example
# ["--continue"] or ["resume", "--last"]). Used only when the run already has a file in one of
# the [[capture.native]] stores below; otherwise the harness opens the normal way. Delete if the
# harness cannot reopen one.
resume_args = ["<RESUME-FLAG>"]
# Commands of the harness's own program that switch on what the native source needs, when the
# harness has a setting for it but no environment variable (D61). Only how the harness STORES its
# session, never how the agent behaves (model, provider, tools, prompts, compression on or off):
# an argument with model, provider, base_url, api_key, key, token or secret as a dotted part is
# refused. Run in the harness home after
# the participant's setup in `goalcup prep`, and again before each launch, so each must be safe to
# run twice. Chat mode only. At most 4 commands of 1 to 16 arguments; the args rules apply; no
# {template}. Their output goes to a log, never the terminal. Delete if the harness needs none.
# configure = [["config", "set", "<sessions.save_transcripts>", "true"]]
#
# B) Headless instead (one goal, no terminal): delete the four values above and use
#   args = ["<SUBCOMMAND>", "<FLAG>", "--"]   # argv WITHOUT the program and WITHOUT the goal
# with ONE goal placement: end args with "--" (the goal is the next single argument), or set
#   goal_flag = "--<LONG-OPTION>"           # the goal is --flag=<goal>; args must NOT end in "--"
#   continuation = "none: <HOW ONE HEADLESS TURN RUNS>"
# {session_id} is allowed in values only with identity "preassigned".
# Sign-in/token-refresh hosts, tunnelled opaquely and never recorded. Delete if none.
# auth_hosts = ["<AUTH_HOST>"]
# Where the harness saves the model service the participant picks (D62): a file in its config
# home (.yaml, .yml, .json or .toml) and the dotted key of the service's URL. Facts sheet
# section 6 says where. The tracer reads that one value at each start and continue and records
# that host only; every other host stays an opaque tunnel. The default for any harness whose
# model service is the participant's choice. Needs config_home = "shared"; the file and key may
# not name a key file or a key (auth, credential, secret, token, key, env).
model_host_from = { file = "<config.yaml>", key = "<model.base_url>" }
# A harness that can reach one fixed service only: its row from the shared provider table
# (crates/goalcup-protocol/providers.toml), or a [[capture.hosts]] row below. Delete if none.
# providers = ["anthropic"]
# Your harness's own variable namespace, if it has switches that would silently stop capture
# (a safe mode, "ignore config"): capture.env may then set no name under it. Delete if none.
# reserved_env_prefixes = ["<HARNESS>_"]

[capture.executable]
program = "<PROGRAM>"                   # bare name on PATH; not an interpreter (python3, node, sh)
version_args = ["--version"]            # how the harness prints its version; delete if it has none

# Child-only extra variables. Delete the table if none. No endpoint, proxy, credential,
# provider, XDG_*, GIT_*, OPENSSL_*, CA, *KEYLOG*, *_COMMAND/*PAGER or server names (*_URL,
# *_BASE, *_HOST, *_ADDR, *_SERVER, ...); no value with "/" "~" "$" or "://".
# SHELL is the one path value allowed: "/bin/zsh", "/bin/bash" or "/bin/sh".
# A value may name the run's homes: {config_home} (the harness home) or {run_home} (the private
# HOME), for a second state variable: <HARNESS>_DATA_DIR = "{config_home}/data".
[capture.env]
SHELL = "/bin/zsh"                      # the shell the harness's tools run in, per platform below
# Is the harness Node (an npm package, or a script starting `#!/usr/bin/env node`)? Then keep
# this line: Node's built-in HTTP client ignores HTTPS_PROXY without it (D59), and the run
# records no model traffic. The kit's stand-in cannot see that. check-connector.sh fails when
# `program` on PATH is a node script and this line is missing; a compiled Node or Bun binary it
# cannot tell apart, so only a real run shows it. Delete the line only if facts sheet section 6
# says the harness honours HTTPS_PROXY on its own.
NODE_USE_ENV_PROXY = "1"
# <HARNESS>_DISABLE_UPDATES = "1"

# Linux has no /bin/zsh by default.
[capture.platform.linux-x86_64.env]
SHELL = "/bin/bash"

[capture.platform.linux-aarch64.env]
SHELL = "/bin/bash"

# Does the harness have a variable that moves its config (like CODEX_HOME)? Pick ONE shape.
# C1) Yes (as below): its sign-in lives in a shared, isolated config home; run_home "empty"
#     (or "keychain_link" when it keeps its login in the macOS Keychain).
# C2) No: delete `env`, `skills_dir` and the C1 values, and use
#       run_home = "shared"             # one isolated HOME kept across serialized runs: the sign-in lasts
#       config_home = "per_run"
#     with the native root "{run_home}/<sessions>" and since_run_start = true. Never "empty"
#     here: a fresh HOME each run loses the participant's sign-in every run.
# C2 cannot use model_host_from: that field needs a shared config home plus home.env.
# A participant-selected model service without such a home relocator is facts-only for now.
# Headless: config_home "per_run" (needed for seeds and dirs; no provider-key handoff).
[capture.home]
run_home = "empty"                      # "empty", "keychain_link" (macOS keychain only) or "shared" (C2)
config_home = "shared"                  # C1 chat mode; "per_run" for C2 and headless
env = "<HARNESS>_HOME"                  # own home var: ^[A-Z][A-Z0-9]*_(HOME|CONFIG_DIR)$
real_dirs = ["{user_home}/.<harness>"]  # the participant's real state dirs (never written)
# Where the harness reads its skills, below the config home: the goal-cup skill is put in
# <skills_dir>/goal-cup/ before each launch. Delete if the harness has no skills folder.
skills_dir = "skills"
# per_run only (headless):
# per_run_dir = "<harness>-home"        # folder name below the run home
# dirs = []                             # relative dirs created mode 0700
# Seeds: files copied from connectors/<HARNESS_ID>/files/<file> into the config home.
# No credential, URL or user data. mode is "0600" (default) or "0400".
# seed = [{ file = "config.yaml" }, { file = "settings.json", mode = "0400" }]

# No [capture.credential]: a connector may not pass a provider key; the harness keeps its own
# login in its home (D61).

[capture.ca]
# One or two CA variables the harness reads (facts sheet section 6); no core change needed:
# - its own variable, ending _CA_CERTIFICATE, _CA_CERTIFICATES, _CA_CERT, _CA_CERTS, _CA_BUNDLE
#   or _CA_FILE (NODE_EXTRA_CA_CERTS for Node and Bun). It gets the proxy CA alone.
#   mode "extend": the variable ADDS to the harness's roots.
#   mode "replace": the variable REPLACES them, so the harness trusts only the proxy (fails closed).
# - only if it has none: SSL_CERT_FILE / REQUESTS_CA_BUNDLE, with mode "extend". Tool children read
#   these too, so they get the system roots plus the proxy CA, and a connection the harness makes
#   past the proxy is not recorded (docs/CHEAT-CHECKLIST.md). Prefer the harness's own variable.
env = ["<CA_VARIABLE>"]
mode = "<extend|replace>"

[capture.identity]
# Exactly one block. The four admitted pairs are the whole list. Chat mode takes 1).
# 1) No session id. With a shared config home the native row sets since_run_start = true;
# otherwise the native root must be {run_home}/... or a per-run {config_home}/...:
source = "none"
# Headless may instead use one of these:
# 2) The tracker mints the id and passes it in args via {session_id}:
# source = "preassigned"
# binding = "at_launch"
# 3) The harness prints a JSON line on stdout before any model text:
# source = "stdout_json"
# binding = "at_launch"
# match_field = "<type>"                # dot path to a field that marks the start event
# match_value = "<session.started>"     # its value
# id_field = "<session.id>"             # dot path to the session id
# 4) The harness prints "<prefix><id>" on stderr:
# source = "stderr_line"
# binding = "deferred"
# prefix = "<session_id: >"             # 1-32 printable ASCII bytes
# grammar = "<token|timestamp-hex>"     # token: [A-Za-z0-9_-]{1,128}

# Exactly one own-session native store. Never a request dump, credential or seed file.
[[capture.native]]
name = "<session>"                      # label in the chain; [A-Za-z0-9._-]{1,64}
root = "{config_home}/<sessions>"       # {config_home} (C1) or {run_home} (C2), plus relative parts
pattern = "<*/*.jsonl>"                 # globs below root, no **; {id} exactly once unless identity is "none"
form = "<append_only|snapshot>"         # JSONL appended in place, or a file rewritten whole
# protocol_hint = "<harness-jsonl>"     # append_only only; an unknown hint means capture-only
# The run's sessions are every matching file new or written since the run started (chat mode on
# a shared home: no id is known at launch). Delete for a per-run root or an {id} pattern.
since_run_start = true

# Only if the harness pre-scans argv for options it acts on (see the Hermes connector).
# [capture.argv_guard]
# long = ["profile"]
# short = ["p"]
# short_with_value = []
# long_abbreviations = false

[capture.termination]
strategy = "process_group"              # or "native_pid" with native_binary = "<binary>"
grace_seconds = 10                      # 1-60

# Plan, quota and billing data the harness sends or writes. One form per row: a JSON field with
# value = "object" | "string" | "scalar", or a header prefix. Never a regex. Delete if none.
# [redaction]
# extra_patterns = [
#   { kind = "<harness>_plan_type", json_field = "plan_type", value = "string" },
#   { kind = "<harness>_billing_header", header_prefix = "x-<vendor>-billing-" },
# ]

# A fixed intercepted model host, for a harness that can reach one service only (with
# model_host_from, none is needed). Up to 16, counting the `providers` rows; each needs at least
# one recorded path. Traffic to a host neither listed nor named by model_host_from passes
# through unrecorded. Delete the row if model_host_from or `providers` covers the service.
# [[capture.hosts]]
# host = "<api.provider.example>"       # public DNS name; no scheme, port, wildcard or localhost
# evidence_paths = ["</v1/chat/completions>"]
# prefix_paths = ["/v1/"]               # path prefixes; "/" alone is refused
# protocol_hint = "<openai-chat-completions>"
